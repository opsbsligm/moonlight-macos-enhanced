name: Build and Release

on:
  push:
    # master and main, plus the integration branches this repository actually works
    # on. Verifying a push to pr-overhaul used to mean remembering to press Run
    # workflow: six times in one morning, each a full macOS matrix started by hand,
    # each a red that arrived minutes after the commit instead of at it.
    branches: [master, main, 'pr-*', 'integration/*']
    tags:
      - 'v*'
  pull_request:
    branches: [master, main]
  workflow_dispatch:

# Every job starts read-only on repository contents. The release job raises it
# to write for itself alone, so a build step handed untrusted input cannot
# rewrite the repository.
permissions:
  contents: read

# One live run per pull request or ref. A new push replaces its predecessor
# instead of queueing a second full macOS matrix, and a tag release is never
# cancelled underneath by a later push.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # A push to a working branch supersedes the commit before it, so the older run is
  # worth cancelling: re-verifying a commit nobody will ship costs ten macOS minutes
  # for no information. Trunk and tags are different animals -- a release in progress
  # is never cancelled underneath someone.
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' && github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}


jobs:
  # Cheap repository audits that do not need Xcode. They gate every build job
  # so a broken tree fails in seconds instead of after a full matrix build.
  audit:
    timeout-minutes: 15  # seconds of grep plus the mutation battery
    name: Repository audits
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Set up Python for the audits
      # The workflow audit needs PyYAML, which the runner image does not promise.
      # A guard that silently loses its parser is worse than no guard, because it
      # reports success while checking nothing. One pinned interpreter and one
      # pinned parser keep the failure loud.
      uses: actions/setup-python@v6
      with:
        python-version: "3.12"

    - name: Install the parser used by the workflow audit
      run: python3 -m pip install --quiet --disable-pip-version-check pyyaml==6.0.2

    - name: Verify the product installs under a name that is not the Qt client's
      # `product_name()` is the single reader of the bundle name for the DMG packaging, the
      # codesign step, the workflow paths and the README install line. It is worth a gate
      # because the refusal is the interesting half: an identity reader that reads anything
      # at all would certify a build that replaces another client's app.
      run: python3 scripts/project_identity.py --self-test

    - name: Verify no credential is carried by this tree
      # Every audit here reads source to ask what the code does. None of them asks
      # what a file happens to contain, so a token pasted into a helper during a
      # debugging session would be built, tested, artefacted, and pushed without
      # comment. A push is the unforgiving half: the value is then in the object
      # store, in every fork made afterwards, and in any log that echoes the file,
      # and a revert removes it from none of those. The runner checkout is shallow,
      # so the whole-history pass is the local aggregate's job, not claimed here.
      run: |
        python3 scripts/credential-scan-audit.py --self-test
        python3 scripts/credential-scan-audit.py

    - name: Verify localization coverage
      run: python3 scripts/l10n-audit.py

    - name: Verify every source file is compiled
      run: python3 scripts/source-membership-audit.py

    - name: Verify project constraints
      run: python3 scripts/constraints-audit.py

    - name: Verify the liquid glass rules
      # A glass look can be faked with a blur and a material, and the fake passes
      # a code review and a build. These rules are checked against fixtures that
      # break each one, then against the real glass surface.
      run: |
        python3 scripts/liquid-glass-audit.py --self-test
        python3 scripts/liquid-glass-audit.py

    - name: Verify the published-image checksum rule
      # A release page that hands out a DMG nobody hashed is a download nobody can
      # check. This half of the DMG gate runs anywhere, because a checksum is not a
      # filesystem question; the mount half runs on the macOS job that builds the
      # image, and both halves are wired into the local aggregate.
      run: python3 scripts/dmg-audit.py --self-test-checksums

    - name: Verify the release tag rule set
      # The gate below only helps if its rules are exercised on every change.
      # These fixtures are the only place the accept path is checked, because on
      # any given commit the real tree usually refuses every candidate tag.
      run: python3 scripts/release-gate.py --self-test

    - name: Verify the memory ceiling's own rules
      # `leaks` needs a macOS runner and a built app, so the ceiling itself is judged
      # there. What can be judged anywhere is whether the reader and its rules still
      # work, and that is the half that rots silently: a report format that changes under
      # the reader makes it count zero leaks, which is a green check over a leaking app.
      # Measured -- the first report this gate was pointed at was `leaks`' default tree,
      # whose summary counted 105 leaks while its body drew a graph, and the audit said
      # "first-party classes: none" and exited zero.
      run: python3 scripts/leak-audit.py --self-test

    - name: Verify the memory ceiling still refuses what it must refuse
      # A gate nobody has seen fail is a gate nobody can trust. These breaks are made in
      # scripts/leak-sample.txt, a real captured sweep of the settings page with this
      # machine's identifiers stripped, so the class tokens, sizes and block counts are
      # `leaks`' own, not written to match this script's regular expressions. Each break
      # has to be refused for its own reason; the last one has to pass, because a ceiling
      # that cannot tell a fixed leak from a broken report is a ceiling somebody mutes.
      run: python3 scripts/leak-audit.py --log scripts/leak-sample.txt --red-team

    - name: Verify the ownership experiment's own rules
      # Section 5 of docs/memory-ownership.md is a fix waiting for evidence, and the evidence is
      # now measured rather than argued: the Debug probe holds a TemporaryApp with no host and
      # reports what survives. The measuring needs a macOS runner and a built app; what needs
      # neither is whether the reader still refuses what it must. Its controls are the fragile
      # part -- a probe that leaks its own pair would report today's retain cycle as a green
      # reading of the app -- so both controls, every refusal, and the contradiction between a
      # header and an observation are fixtures here.
      run: python3 scripts/ownership-audit.py --self-test

    - name: Verify the ownership experiment still refuses what it must refuse
      # Same reason the leak reader has a red team, with one more on top: the mutations are made
      # to scripts/ownership-sample.json, a real record of a real run with this machine's host
      # identifier replaced, so a rule that only bites on invented numbers is caught here rather
      # than trusted. The mutation that matters most is a declared cycle that leaked nothing --
      # the shape a broken experiment reports, not a fixed app.
      run: python3 scripts/ownership-audit.py --red-team

    - name: Verify the workflow can actually run
      # A plain yaml.safe_load accepts a step whose run: key was dropped, and a
      # step with two run: keys. GitHub accepts neither: the run turns red before
      # any job exists, so the pipeline reports failure with no job list and no
      # log. These rules cover what a parse cannot see.
      run: |
        python3 scripts/workflow-audit.py --self-test
        python3 scripts/workflow-audit.py
        for script in scripts/*.sh; do
          bash -n "$script"
          echo "shell syntax ok: $script"
        done

  build_arch:
    timeout-minutes: 45  # a cross-compile, seven harnesses and a DMG
    name: Build ${{ matrix.variant }}
    needs: audit
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: arm64
            # "macos-26-arm64" is the image name in the runner-images docs, not
            # a label. The label that selects the arm64 machine is macos-26, and
            # a runs-on that names the image matches no hosted runner: the job
            # then sits queued with no failure and no log to read.
            runner: macos-26
            destination: 'platform=macOS,arch=arm64'
            archs: 'arm64'
            display_name: Apple Silicon
          - variant: x86_64
            # x86_64 is cross-compiled on the arm64 image on purpose. Intel
            # macOS is hosted, as macos-26-intel and macos-26-large, but using
            # it would tie every release to a second machine class for no
            # benefit: each vendored xcframework ships a
            # macos-arm64_x86_64 slice, so the x86_64 link is satisfied from an
            # arm64 runner.
            runner: macos-26
            destination: 'platform=macOS,arch=x86_64'
            archs: 'x86_64'
            display_name: Intel

    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Read the product name from the project
      # Every path below -- the bundle copy, the codesign target, the tar member, the DMG
      # icon and drop positions -- has to name the bundle the project decides to build.
      # A literal in this file would be a second source of truth, and the day the product
      # is renamed one of these lines would keep packaging the old name (upstream issue 41
      # is what two names for one bundle did to people's /Applications).
      run: echo "APP_NAME=$(./scripts/product-name.sh)" >> "$GITHUB_ENV"

    - name: Setup Xcode
      # Pinned to a commit rather than the moving v1 tag: this step runs before the
      # compiler on every build job and decides which toolchain the build sees.
      # ed7a3b1 == v1
      uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90
      with:
        xcode-version: latest-stable

    - name: Show Build Environment
      run: |
        xcodebuild -version
        swift --version
        uname -m
        echo "Available schemes:"
        xcodebuild -list -project Moonlight.xcodeproj || true

    - name: Prepare vendored dependencies
      # Run the same script a developer runs. This step used to duplicate the
      # xcframework download inline, which drifted away from the script and left
      # Packages/OpenSSL.xcframework and the libs/openssl header symlink absent
      # on every runner, so both were missing before the compiler could report
      # anything. One shared entry point keeps the two environments identical.
      run: |
        ./scripts/download-frameworks.sh
        ls -la xcframeworks/
        ls -la Packages/OpenSSL.xcframework/
        ls -la libs/

    - name: Resolve build number
      # build-number.sh is a scheme PreAction and command-line xcodebuild ignores
      # PreActions; the #include? in Version.xcconfig cannot resolve
      # $(DERIVED_FILE_DIR) at parse time either. Command-line settings outrank
      # every xcconfig, so the resolved value has to be injected there.
      run: |
        echo "BUILD_NUMBER_RESOLVED=$(sh Limelight/build-number.sh --print)" >> "$GITHUB_ENV"
        echo "resolved BUILD_NUMBER=$(sh Limelight/build-number.sh --print)"

    - name: Verify input concurrency invariants
      # The pointer delta handoff between the GameController callback queue and
      # the CVDisplayLink output callback crosses threads. A compound update on
      # an atomic property compiles, links and ships with no signal at all, so
      # the only protection is a behavioural check. The harness extracts the
      # implementation from Limelight/Input, runs it in the real topology and a
      # wider one, then rebuilds the previous semantics to prove the check
      # still notices the race.
      run: python3 scripts/input-concurrency-tests.py

    - name: Verify two keys held at once
      # Pressing W and Space together -- walk and jump -- is the report this
      # gate exists for. A held-key table with the right words in it can still
      # tangle two concurrent keys, and neither the compiler nor a reviewer
      # notices. The harness extracts the state machine from Limelight/Input,
      # drives it with real NSEvents in the shapes a pair of hands produces, and
      # rebuilds the pre-fix shape to prove the scenarios can fail.
      run: python3 scripts/keyboard-concurrency-tests.py

    - name: Verify two Mac keys that share a Windows code stay two keys
      # Return and Keypad Enter both leave as VK_RETURN, Equals and Keypad
      # Equals both as VK_OEM_PLUS, so a held-key record filed under the code
      # that went out keeps one entry for two fingers, and letting go of one
      # spends the record of the other: the press still held is invisible when
      # capture ends, and the host keeps it down for the rest of the session.
      # The harness reads the colliding pairs out of keys[] itself, drives them
      # to capture end with a finger still down, and rebuilds the record that
      # shipped to prove the scenario can fail.
      run: python3 scripts/held-key-identity-tests.py

    - name: Verify a gamepad press reaches the responder as a whole keystroke
      # NavigatableAlertView synthesises the keystroke a pad cannot press: D-pad becomes
      # Tab and Shift+Tab, A becomes Return, B Escape, X Space. Its helper takes a
      # `down:` argument and then calls keyDown: whatever it was told, and every caller
      # said YES, so the responder was handed the press of a stroke and never its release.
      # The harness compiles the real view against a spy responder that records which
      # selector ran, the key code, the flags, and the type inside the event.
      run: python3 scripts/controller-key-navigation-tests.py

    - name: Verify a Space change releases the keys held across it
      # -releaseAllModifierKeys sends eight fixed VK packets and nothing else, and the
      # active-Space path that skips the uncapture used to release nothing but those,
      # so a movement key held while the Space changed stayed pressed on the host with
      # no window left on that Space to deliver its keyUp:.
      run: python3 scripts/space-transition-held-key-tests.py

    - name: Verify a shortcut cannot fire a pending modifier-only release
      # Ctrl+Option held alone is the mouse-capture escape hatch: 150 ms later the
      # app lets every modifier go on the host and uncaptures. Six shipped shortcuts
      # sit behind that same modifier pair, and a letter key does not move the
      # modifier flags, so the timer used to fire on top of the shortcut -- modelled
      # here as a timeline and shown to collide again when the guard is removed.
      run: python3 scripts/modifier-only-release-collision-tests.py

    - name: Verify the modifier mapping sends the key that was pressed
      # This module is the single source of truth for Command-to-Win, Control-to-Ctrl,
      # Option-to-Alt and Shift-to-Shift, each side to its own side, and it was the one
      # part of the input pipeline with no test, no constraint and no scenario naming it
      # at all. A table entry pointing at the wrong side, or two mac keys collapsing onto
      # one remote key, would have shipped silently and arrived as "my keyboard feels
      # wrong in games". The harness compiles the shipped file, walks all eight modifier
      # keys through keycode to physical slot to remote bit to Windows virtual key, and
      # checks the virtual keys against values written out in the harness rather than
      # against the same table. Two planted variants -- both hands of a modifier
      # answering as the left hand, and the flags path answering Command with Alt --
      # have to fail the same scenarios.
      run: python3 scripts/keyboard-modifier-mapping-tests.py

    - name: Verify a shortcut cannot drop a modifier the player is holding
      # A mouse-driven translation rule fires its shortcut by hand: it presses its
      # modifiers, fires its key, then lets its modifiers go. When the player is holding
      # one of those modifiers for real -- Shift to sprint, a Shift+Tab rule -- the rule
      # released it, and because the physical modifier tracker was not part of that
      # hand-written packet sequence, the diff on the next event came out zero and no
      # corrective press was ever sent. The player kept Shift down and the game had
      # stopped sprinting, with nothing logged on either side. The harness extracts the
      # shipping state machine and both synthetic paths, compiles them against the real
      # resolver, and asserts two things per scenario: the packets the host would
      # receive, and that the app's own tracker still matches what the host holds. The
      # unconditional-release shape has to fail those scenarios.
      run: python3 scripts/keyboard-shortcut-modifier-tests.py

    - name: Verify the stream's panels get real glass
      # Seven overlays drew the pre-glass HUD-window vibrancy, so the surfaces a player
      # looks at during a session were the part of the interface that never moved to the
      # liquid-glass APIs while settings and the tab bar had. The container in
      # Limelight/macOS/Views answers that once, and this compiles and runs it to report
      # what it really built: the background class behind the content, whether the corner
      # radius reached it, whether the content still covers the panel instead of being
      # inset by the glass rim -- the panels lay their controls out by frame, so an inset
      # would move every control in the log browser -- and what the Core Animation tree
      # underneath is made of. The glass-less shape has to be refused on a host that has
      # glass, which is what makes the availability branch a behaviour and not a claim.
      run: python3 scripts/liquid-glass-overlay-tests.py

    - name: Verify a multi-notch wheel event is worth the notches it carries
      # HIDScrollEventDiscreteDeltaForAxis reads the notch count out of the event's own
      # wheel fields, which carry several at once whenever AppKit coalesces a fast
      # scroll into one event, a free-spinning wheel reports several detents, or the
      # driver reports a jump. HIDNormalizedDiscreteScrollClick rounded that and
      # clamped it to one, and unlike the accumulated path there is nothing to keep the
      # rest: the quantized and fallback branches answer once per event, so a
      # three-notch event shipped one and the other two never existed. The harness runs
      # the shipping count and the new packet bound, keeps the floor that belongs (a
      # detent too small to round still has to move), and restores the clamp to prove
      # the verdict can fail.
      run: python3 scripts/discrete-scroll-click-tests.py

    - name: Verify the pointer ships the motion it was asked for
      # HIDScaledRelativeDelta answered every display-link frame on its own and promised
      # a whole pixel whenever the scaled move was non-zero but under one. Pointer
      # Sensitivity goes down to 0.25, so a careful move asked for a tenth of a pixel a
      # frame and shipped a whole one: the low half of the slider changed how often the
      # promise fired rather than how far the cursor went, and a still hand drifted
      # because every jitter of any size shipped a pixel nobody asked for. The harness
      # runs the draining replacement frame by frame at both ends of the real slider
      # range, asserts the shipped total may trail the asked total but never lead it,
      # and rewires both shipping paths back to the per-frame answer to prove it can
      # fail.
      run: python3 scripts/relative-pointer-gain-tests.py

    - name: Verify the edge summon band lets go only for a player who meant it
      # The dock used to answer one question -- did the pointer already escape capture --
      # which made it unreachable in the relative mode a game is played in, where the
      # pointer never gets near an edge. The band answers whether the player is holding
      # against the dock's edge (150 ms within 2 pt) or pushing at it (30 pt accumulated,
      # one event worth at most 6 pt), and the harness compiles the shipped helpers out of
      # MouseCapture.m and drives them, then refuses a tree where a single uncapped flick
      # spends the budget or the switch stopped being the first question asked.
      run: python3 scripts/edge-sensor-summon-tests.py

    - name: Verify the system hotkey handoff is paired in both directions
      # Taking the player's Mission Control, Launchpad, Spotlight and input-source switch is a
      # WindowServer call Apple neither documents nor links, and a suppression that outlives the
      # stream is worse than a key that stays local: the app has nothing left to give the keys
      # back, so the player quits the app to get their desktop back. The harness drives the
      # shipped state function (only a CGError of 0 may move the ledger, so a refused call cannot
      # leave a claim behind), reads the six window and activation moments that take the keys
      # against the ones that return them, and refuses a tree where teardown stops returning them,
      # where "never capture" is ignored, or where the return is moved onto the path that a
      # viewDidAppear re-registration runs first.
      run: python3 scripts/system-hotkey-capture-tests.py

    - name: Verify every reader of an event's keyCode asks what event it holds
      # Some drivers leave a value in the keyCode field of a mouse event that collides with
      # kVK_ANSI_C, and reading it is what once made a fast double-click send C at the host --
      # a press with no release, which is all an auto-repeat needs. The fix a while back was a
      # type gate, and the header states it as a rule for ALL readers, which is a rule that
      # lives in prose: this reads the tree. A reader passes only when its own body asks about
      # event.type -- not because a caller does, and not because the function is named keyDown:,
      # since a method with that name in a non-responder class is handed its event by a caller,
      # one hop from the driver. Its red proofs take the gate out of -[HIDSupport keyDown:], out
      # of a helper that relied on its callers, and put one into -mouseDown:.
      run: python3 scripts/key-code-read-site-audit.py

    - name: Verify the frame interpolation cadence answer is one answer
      # Whether a display can carry interpolation at a stream rate is one arithmetic fact, but the
      # renderer (which refuses to build the engine) and the settings page (which has to warn
      # before a stream starts and name a rate that would work) both act on it. As two copies of
      # the formula, a player can be told to pick a rate the renderer then refuses -- worse than no
      # warning, because they already did what they were asked. The harness compiles the shipped C
      # policy and drives 49 readings, then refuses a tree where the renderer keeps its own copy
      # of the arithmetic beside the shared call, or where the page offers a rate the policy would
      # never recommend.
      run: python3 scripts/interpolation-cadence-policy-tests.py

    - name: Verify the interpolation readout carries measurements to the settings page
      # The page could name the engine but could not say what frames did, and the one place that
      # counted them -- the performance overlay -- exists only when the player enabled it. The
      # harness lifts the shipping publisher out of VideoDecoderRenderer.m and plays it against a
      # fake settings class, so the frame rate it hands over is the shared policy's answer for the
      # refresh it was given (180 Hz yields 120, 179 yields 90, 44 yields nothing) rather than a
      # constant, the four readings arrive from the counters they name, and stopping a stream
      # zeroes them instead of leaving last second's numbers on screen. Its red proofs move the
      # feed onto the overlay's timer, which is the shape that would look fine on a laptop and go
      # quiet for exactly the players who never turn the overlay on.
      run: python3 scripts/interpolation-readout-tests.py

    - name: Verify the stick-driven pointer keeps the travel it promises
      # Two files move the cursor with the right stick, and they disagreed. The HID
      # consumer normalised the stick to a fraction, multiplied by 15.0 and truncated
      # the product per frame with nothing kept, so a stick held just past the
      # deadzone asked for one and eight tenths pixels and shipped one: 45 per cent of
      # the movement a player asked for disappeared, and only a full deflection kept
      # its promise. The display-link consumer accumulated and was already exact, so
      # the same stick meant two cursor speeds depending on the device, and the two
      # deadzones (4000 counts out of 32767 there, 0.1 of full scale here) did not
      # even agree on where movement began. The harness runs the shared normaliser and
      # the draining helper the shipping call sequence uses, and restores the
      # per-frame truncation to prove the verdict can fail.
      run: python3 scripts/controller-mouse-emulation-tests.py

    - name: Verify one scroll event sends the notches it received
      # A rewritten or synthetic scroll accumulates displacement across frames and
      # then asks the notch consumer how much of it may leave now. That consumer
      # clamped its answer to one notch and subtracted one notch, and a gesture ends
      # by simply stopping -- nothing else empties the accumulator -- so every notch
      # it kept was a notch the host never heard about: four frames asking for fifteen
      # and a half shipped four. The faster the flick, the larger the lost fraction,
      # which is scrolling that will not keep up. The harness compiles the two shipping
      # consumers together, because the high-resolution neighbour that subtracts
      # exactly what it returned is the control, and it re-clamps the fixed one to
      # prove the property can still fail.
      run: python3 scripts/scroll-notch-consumption-tests.py

    - name: Verify a held modifier survives the key pressed beside it
      # A flagsChanged names the key that just moved, but AppKit's Shift bit is a
      # snapshot of the whole family: hold one shift, release the other, and the
      # family bit stays set because the first one is still holding it. Reading
      # that bit recorded the released shift as held for good, so the host kept a
      # modifier nobody is touching and every key after it carried Shift -- a walk
      # that would not slow down, and a Space that arrived as Shift+Space. That is
      # the "W and Space collide" report one layer underneath the pair that was
      # noticed, and no source grep can see it: the code reads the flag AppKit
      # really does set. The harness compiles the shipping state machine and its
      # mapping table, replays hand shapes, and records the modifier byte beside
      # each key code, then rebuilds two wrong shapes to prove it can fail.
      run: python3 scripts/held-modifier-keyboard-pair-tests.py

    - name: Verify every order of four keys keeps its meaning
      # The two harnesses above each replay one timeline somebody wrote down, so the
      # orders they cover are the orders a person thought of. A stranded key lives in
      # an order nobody pictured -- let go of the right Shift between the jump's press
      # and its release, while the left one is still sprinting. This harness therefore
      # enumerates: four keys (both Shifts, W, Space), every interleaving that keeps
      # each key's own order, 2520 of them, each on a fresh state machine. It asserts
      # the host is told about each key once down and once up, that both modifier
      # masks are empty when the hands leave, and that every modifier byte agrees with
      # the shift keys the host itself was told about -- not with the byte from the
      # press, which would be wrong for the ordinary case of releasing Shift mid-jump.
      # Three planted shapes prove it can fail, and each one breaks 1816 of the orders.
      run: python3 scripts/key-order-exhaustive-tests.py

    - name: Verify a rule that takes a key takes its release too
      # A keyboard translation rule that fires has to keep its side of a promise that
      # spans two events: it stops -keyDown:, so the release that AppKit still delivers
      # is the client's to swallow, and the next press of that key has to spend whatever
      # record was left. The rules already written over this file count how often a
      # method is called, which stays green while the state outliving the call is wrong.
      # This harness plays the shipping matcher and the shipping record against each
      # other: two keys, every combination of the five modifiers the shortcut layer
      # reads, six rule shapes, the guard answering both ways, and three shapes of
      # release -- including one that never arrives. Four planted shapes fail 304, 210,
      # 80 and 6 cases. A sweep that never fired a rule once also fails, because it did
      # exactly that on its first run and reported ok while doing so.
      run: python3 scripts/translation-rule-consumption-tests.py

    - name: Verify a Shift-only binding cannot steal the movement keys
      # Shift is sprint, aim and the jump variant in a game, and the player holds it
      # while pressing the movement cluster, so a translation rule triggered by
      # Shift+W is reachable by ordinary play -- and a matched rule consumes the
      # press. The host then never learns the player started running forward, and the
      # release that does arrive reads as a key letting go by itself, which is the
      # "W and Space collide when I play" report. The answer is asked twice, at two
      # moments that cannot see each other: in Objective-C when a key arrives, and in
      # Swift when a person records a binding. This harness compiles both out of the
      # shipping files and plays all 128 modifier shapes through each, requires the
      # two answers to agree shape by shape, requires Shift+W and Shift+Space to be
      # named, and requires every binding the app ships with to survive -- the six
      # Control+Option actions, Command+W and Control+Shift+W included. A guard that
      # never fires, one that also seizes Control, Option and Command, and a form that
      # learned the rule on its own each turn it red.
      run: python3 scripts/gameplay-modifier-tests.py

    - name: Verify the enhancement that runs is the one that was asked for
      # The rules over the enhancement code ask the GPU whether it can scale and count
      # the interpolation slots a machine offers -- both true statements about capability,
      # and neither reads the decision. The renderer stores an active engine and a reason
      # beside it, so a mode could resolve to nothing on every machine, or resolve to a
      # quieter engine than the one picked, and every rule above would still pass. This
      # harness lifts the resolver and sweeps it against a stated policy: seven modes,
      # HDR on and off, five source and window pairs, every combination of the three
      # capabilities, 564 resolutions. Each has to agree on the engine, on the scale the
      # decision was made from, and on giving a reason, because "why did my scaler not
      # engage" is answered from the log and nowhere else. Five planted shapes fail 12, 8,
      # 26, 80 and 220 cases; the sweep also fails when an engine is never reached, which
      # is how it catches itself testing nothing.
      run: python3 scripts/enhancement-engine-resolution-tests.py

    - name: Verify the frame interpolation report says what happened
      # The settings page shows two lines about interpolation: the engine that ran, and a
      # sentence meant to explain it. That sentence used to be picked by searching the
      # reason for a phrase, and the phrasing was the bug. "provides cadence headroom over"
      # and "does not have cadence headroom over" share the phrase one branch looked for,
      # so an interpolation that was running was described by the sentence saying it had
      # refused; and a frame that failed after the feature engaged was caught by the
      # shortcut that only asks whether the engine is none, telling a player who turned it
      # on that no stream had asked for it. Two translated sentences were unreachable on
      # every machine. This harness enumerates the eleven states the renderer can report,
      # with the shipping gate answering for the refusals and the shipping texts lifted
      # rather than retyped, and demands each one land on its own sentence -- four planted
      # shapes fail, and so does any answer count below the one the player needs.
      run: python3 scripts/frame-interpolation-status-tests.py

    - name: Verify a stream the interpolator cannot take is refused once, not per frame
      # A low-latency interpolation configuration takes one source pixel
      # format, and measured on Apple silicon that format is 420v. The
      # decoder is asked for something else whenever the stream is 10-bit
      # or 4:4:4 -- ordinary settings, HEVC 10-bit being a common default
      # -- so the mismatch arrived on every decoded frame. The shape this
      # replaced fell through to a warmup request, the warmup answered
      # that a session for this size already exists and did nothing, the
      # caller read that as a runtime failure and tore the session down,
      # and the next frame built another configuration, queried the
      # hardware for slots, allocated another frame processor and started
      # another session, only to be refused at the same line: one
      # hardware video session destroyed and rebuilt per frame, a warning
      # per frame, and a settings status alternating between two
      # sentences so it never de-duplicated.  The refusal is now
      # remembered as a fact about the stream, the session that is
      # already there is left alone, and the settings page says what is
      # actually true instead of borrowing the sentence for a session
      # that broke. The decision is one file-scope function so the two
      # cannot drift.  The harness compiles and runs the shipping prepare
      # method. The renderer beside it answers the output-pool step the
      # way the machine does, because the outcome turns on a hardware
      # fact: the probe asks VideoToolbox which source formats a
      # configuration takes and hands each format through the real
      # method. A stream in an unacceptable format has to be settled in
      # one step and remembered -- 60 frames have to cost one pool step
      # and no warmup, where the shipped defect cost 60 -- and a stream
      # in an acceptable format has to be unaffected by that memory,
      # which is checked by refusing one format and then running another
      # through the same renderer. Forgetting the refusal, refusing every
      # format because one was refused, and refusing without recording it
      # each turn it red.
      run: python3 scripts/interpolation-source-format-tests.py

    - name: Verify the frames interpolation produced are actually counted
      # The app could name the interpolation engine it chose and could
      # not say whether that engine made a single frame. Nothing counted
      # a produced frame anywhere in the tree, and the one figure a
      # player reads while streaming -- Rd on the performance overlay --
      # is fed only when the frame leaving the drawable is a source
      # frame, because the tally rides inside the branch that records a
      # first source present. So a stream doubled to 120 FPS reported 60
      # Rd, the identical line a stream that is not being doubled
      # reports, and "is interpolation doing anything on my machine" had
      # no answer on the machine running it.  One present has to pick a
      # counter, since both kinds of frame leave through the same
      # drawable, and the pick matters in both directions. Charge an
      # interpolated frame to the rendered counter and it inherits every
      # figure describing the road a source frame travelled: its queue
      # time is measured from a neighbour's enqueue stamp, the 1% low
      # gains an 8ms cadence nobody streamed, and the frame count doubles
      # past what the host sent. Count nothing and the work stays
      # invisible. So VideoStats gained a counter of its own, one file-
      # scope function decides which tally a present feeds, the window
      # that closes publishes it as a rate, and the overlay reads it back
      # beside Rd only when there is a number to say.  The harness runs
      # the product's own bookkeeping: the block that picks and applies
      # the counters is lifted out of VideoDecoderRenderer.m and played
      # against a fake renderer across 213 presents, so 60 source frames
      # plus 60 interpolated frames have to read 60 and 60 rather than
      # 120, a stream nobody interpolates has to read 0, and 25 overlay
      # refreshes over one frame must invent nothing. Charging
      # interpolated pixels at Rd, dropping the increment, reporting the
      # source rate as interpolation and stripping the overlay's
      # condition each turn it red.
      run: python3 scripts/interpolated-frame-count-tests.py

    - name: Verify the scalers' output is counted and the windows that need them get them
      # Two scalers can enlarge a stream in this renderer -- MetalFX inside
      # the render pass, the Video Toolbox processor before it -- and until
      # now the app could name the one it had chosen without saying whether
      # either of them made a single pixel. The overlay quotes the resolution
      # of the *stream*, so a 1280x720 picture the blit stretched to fill a
      # window and a 1280x720 picture a scaler resampled to 2560x2160 print
      # the same line. What is counted is one decision, asked of what the
      # encode actually did, and it refuses a present whose sizes came out as
      # they went in: a scaler that invented no pixels has nothing to report,
      # so "0 fps scaled" stays a claim rather than a description of 1:1
      # blitting.  The gate that decides which scaler may run is asked at the
      # same time, and its question changed shape: "does the panel have more
      # pixels than the stream" is not "is the panel the stream's shape".
      # MetalFX is given an input size and an output size, so a window that is
      # wider than the stream in a different proportion is a window whose
      # pixels still have to be invented, and the resolver used to turn that
      # window away as needing no upscale while it was being drawn at two and
      # three times its size. Six hundred and seventy-six resolutions sweep
      # the new rule, and the pairs keep their edge: 2x across and 3x down is
      # an upscale, 1.5x across and 0.97x down is not, because a window
      # shorter than the stream is not asking the client to make picture.  The
      # harness lifts the enum, the struct, the decision and the block in the
      # draw pass verbatim out of VideoDecoderRenderer.m and plays 360
      # presents, every one of them into a bigger drawable, because the thing
      # being asked is "did a scaler run", not "do the sizes differ". A plain
      # stretch, an exactly-sized panel and a scaler that only widened the
      # frame have to report nothing; MetalFX and the Video Toolbox each have
      # to report their own output size. Charging a stretch, counting a scaler
      # that invented nothing, counting without the size, and letting the
      # frame processor answer for an engine that is not VideoToolbox each
      # turn it red.
      run: python3 scripts/scaling-output-evidence-tests.py

    - name: Verify the timeout overlay can reach its submenus
      # The overlay's three buttons used to find the stream menu's Window, Monitor
      # and Quality submenus by comparing each item's title against a Chinese
      # literal. The titles are localized, so in the English interface the
      # comparison matched nothing, popUpMenuPositioningItem: was never reached, and
      # Resolution, Bitrate and Display Mode did nothing at all -- no crash, no log
      # line, no build failure. A source grep for the word it compared against would
      # have stayed satisfied the whole time. The harness compiles the lookup that
      # ships, hands it menus carrying both languages' titles, and rebuilds the old
      # title comparison to prove the English case can still fail.
      run: python3 scripts/stream-menu-addressing-tests.py

    - name: Verify the settings page renders embedded
      # Goals that are visual cannot be signed off by a compile, and the two
      # visual goals here were waiting on a human eye that was not available. The
      # app carries a Debug-only entry point, inert unless ML_RENDER_PROBE is set,
      # which drives the production settings presenter and measures the result:
      # no second window, the page inside that same window's content, the fade
      # finished, dismissal clean, real pixels drawn, and a Core Animation
      # backdrop layer present so a glass material is actually composited. The run
      # gets its own HOME, which -- measured on 2026-09-25 -- does not give it its own database:
      # the support directory resolves out of the account record rather than out of `$HOME`, so
      # every probe on a machine opens the one library. What that library holds is named by the
      # step below, and the ownership probe reaps only hosts it can prove it planted.
      run: python3 scripts/render-probe.py --timeout 1500

    - name: Verify the settings page leaks nothing new, per visit
      # The probe build the step above just compiled is run again under `leaks`, which
      # attributes every leaked object it can see. First-party leaks are judged against
      # scripts/leak-baseline.json, where the TemporaryHost/TemporaryApp retain cycle is
      # recorded because it was measured here and not assumed -- and the numbers in that
      # file are per leaked host, not counts, because nine sweeps of one unchanged build
      # leaked between 4 and 8 hosts and always three apps per host. A runner with no GameStream
      # host to discover is no longer the empty room it used to be: the sweep asks the probe to
      # seed one host and three apps through the production DataManager, so the graph, the
      # fan-out and the per-host byte budget are all judged here rather than waved past.
      # --growth runs the sweep twice, once at one visit through the page and once at sixteen,
      # and divides the difference by the extra visits and the hosts in the library. That is the
      # only shape in which "this page orphans a graph every time somebody opens it" and "this
      # page orphans one graph once per run" differ -- and only the first gets worse over an
      # evening. The ceiling on the bytes is a doubling sentinel (three graphs per visit per
      # host, where the measured spread on an unchanged build is 192 to 499 bytes), because how
      # often the page reads the library inside one visit is not a number this repository owns.
      # The graph count is judged as a rate over the same window rather than as a count, and the
      # window is fifteen extra visits instead of five because six sweeps of unchanged code put
      # the difference between the two sweeps anywhere from 3 to 6 graphs where the reads entitled
      # 5 -- a count rule refused this job twice on 2026-09-25 (run 36058010642, both variants)
      # for a snapshot, not a leak. See growth_graph_rule_reason in the baseline; the blind spot
      # the ratio leaves is a fixture, not a comment.
      # One line, not a folded one: scripts/local-gates.sh builds its list out of this file
      # line by line, and a flag on its own line is a flag the local sweep never passes.
      run: python3 scripts/leak-audit.py --timeout 900 --growth --growth-cycles 16 --report build/leaks-sweep.txt

    - name: Upload ${{ matrix.variant }} leak sweep
      # The refusal names the rule and prints the offending blocks; the report is the part
      # nobody can rebuild, because the machine that produced it is a runner that no longer
      # exists by the time the log is read. `if: always()` so the report survives the very
      # run that needs it, and `warn` rather than `error` because a host with no `leaks`
      # refuses before any report is written, and that refusal must stay the failure.
      # The glob is the point: `--growth` writes the longer sweep next to the shorter one (see
      # sibling_report), and the run of 2026-09-25 that refused correct code could only be
      # attributed an hour later because the artifact carried the 1-visit sweep while the surplus
      # lived in the 6-visit one, which was never uploaded and is unreproducible after the runner.
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: Moonlight-macOS-leaks-${{ matrix.variant }}
        path: build/leaks-sweep*.txt
        if-no-files-found: warn
        retention-days: 7

    - name: Verify who keeps a host alive, and what that costs
      # The Debug product the two steps above built is asked one question that neither can ask:
      # if the only thing in the process holding an app is the app, is its host still alive? That
      # is the exact state `prepareForSegue:` leaves a stream in (`AppsViewController.m:613`
      # assigns `streamVC.app` and no host), and it is the state section 5 of
      # docs/memory-ownership.md refused to change ownership without seeing. No stream session is
      # needed to look at it, and no LAN either -- the probe seeds one host through the production
      # `DataManager` if the machine has none -- which is why this runs on every push for the cost
      # of starting the app. It answers for the object graph and nothing else: the stream's own
      # host holder is a property no experiment builds, and the audit says so in the same breath
      # as its verdict.
      # It reaps first, and only its own: the steps of a job share one database, so the host the
      # sweep above planted would otherwise be the graph this step measured, reported as an
      # existing library. That is what the runner was doing until 2026-09-25, and it is why the
      # reading it filed said `seeded` when the run itself said `existing-hosts`.
      #
      # The step also asks for two experiments by name. The first plants a host that has a unique id
      # and three of the user's apps, feeds the production parser a server-info body that carries
      # every field a paired machine sends except `uniqueid`, and lets the production write path take
      # its turn. The second asks the same question of the host's name, on a row matched by its uuid
      # rather than by the fall-back, so the two defects are never measured in each other's presence. A
      # host that answers without its id is expected often enough that `getHostForTemporaryHost:`
      # codes a fall-back match for it, and until 2026-09-25 `propagateChangesToParent:` wrote the
      # missing id back over the stored one -- every other field in that method is nil-guarded by
      # the comment above them, `uuid` was not. The device list then deletes whatever has no id, and
      # `Host.appList` cascades, so the applications somebody added went with the host: measured on
      # a live store at 2 to 1 hosts and 6 to 3 apps, for one response that omitted one tag. Asking
      # for those records with `--require-partial` is what stops the step from going green on a build
      # that ignored the flags, which is the same control the reap has -- and the audit raises those
      # probe flags itself rather than trusting this file to set them, because the local gates replay
      # this command line and nothing else, and a control split between a step's environment and
      # its arguments is one they can only fail for the wrong reason.
      run: python3 scripts/ownership-audit.py --timeout 120 --require-partial

    - name: Verify video enhancement paths
      # MetalFX scaling and VT frame interpolation are both object-creation
      # APIs: the call succeeds, the build stays green and the feature can still
      # do nothing. The probe rescales a test pattern on the GPU and counts
      # interpolated edge pixels, then reads the interpolation slot count back
      # out of the configuration, because a machine with no interpolation
      # hardware still creates the configuration and still starts the session.
      run: python3 scripts/video-enhancement-tests.py

    - name: Build ${{ matrix.display_name }} package
      run: |
        set -o pipefail
        xcodebuild -project Moonlight.xcodeproj \
          -scheme "Moonlight for macOS" \
          -configuration Release \
          -derivedDataPath build \
          -destination "${{ matrix.destination }}" \
          ARCHS="${{ matrix.archs }}" \
          ONLY_ACTIVE_ARCH=YES \
          CODE_SIGN_IDENTITY="-" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          BUILD_NUMBER="$BUILD_NUMBER_RESOLVED" \
          build 2>&1 | tee "build-${{ matrix.variant }}.log"

    - name: Fail on warnings in project sources
      # The rule lives in scripts/build-warning-audit.py rather than in this shell, and the
      # reason is this file: scripts/local-gates.sh builds its list out of the python3 calls
      # below, so a check written as grep here never reached that list and never ran on any
      # laptop. The one gate that would have caught a warning in a first-party Swift file was
      # the gate that only ran after a push, next to a local build log that already contained
      # the line. Vendored sources keep their own diagnostics; first-party code stays clean.
      run: |
        python3 scripts/build-warning-audit.py --self-test
        python3 scripts/build-warning-audit.py --log "build-${{ matrix.variant }}.log"

    - name: Fail on a source file nothing compiled
      # Membership is the question "will this file ever reach a binary", and this
      # project's project file cannot answer it: its one membership-exception set is
      # attached to no target, so those 137 entries neither include nor exclude anything,
      # and the build log shows all 93 implementation files under them compiling anyway.
      # The audit reads the transcript when it has one, and this is the only job that has
      # one -- the audit job's copy of the step settles only what a project file can
      # prove, which is an exclusion a target really carries.
      run: python3 scripts/source-membership-audit.py --build-log "build-${{ matrix.variant }}.log"

    - name: Verify ${{ matrix.variant }} binary slices
      run: |
        app_bundle="build/Build/Products/Release/${APP_NAME}.app"
        main_binary="$app_bundle/Contents/MacOS/${APP_NAME}"
        # Derive the helper name from the built bundle instead of hardcoding it.
        # The build phase names the helper "$(PRODUCT_BUNDLE_IDENTIFIER).AwdlPrivilegedHelper",
        # so a bundle id change used to break this check silently in both arch jobs.
        bundle_id="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app_bundle/Contents/Info.plist")"
        echo "Bundle identifier: $bundle_id"
        helper_binary="$app_bundle/Contents/Library/LaunchServices/${bundle_id}.AwdlPrivilegedHelper"

        lipo -info "$main_binary"
        file "$main_binary"

        if [ ! -f "$helper_binary" ]; then
          echo "Expected AWDL helper at $helper_binary"
          exit 1
        fi

        lipo -info "$helper_binary"
        file "$helper_binary"

        main_archs="$(lipo -archs "$main_binary")"
        helper_archs="$(lipo -archs "$helper_binary")"
        echo "Main binary architectures: $main_archs"
        echo "Helper binary architectures: $helper_archs"

        if [[ "$main_archs" != *"${{ matrix.archs }}"* ]]; then
          echo "Main binary missing expected architecture ${{ matrix.archs }}"
          exit 1
        fi

        if [[ "$helper_archs" != *"${{ matrix.archs }}"* ]]; then
          echo "Helper binary missing expected architecture ${{ matrix.archs }}"
          exit 1
        fi

    - name: Verify every source file reached the ${{ matrix.variant }} binary
      # The project file lists every source it intends to compile, which is a
      # claim about the build rather than the build. GlassOverlayContainer.m
      # compiled on its own in a harness, was absent from that list, and appeared
      # in no binary that anyone shipped: no target compiled it, so no target
      # failed. This reads the class table of the linked Mach-O instead, where a
      # file that nothing compiled cannot hide.
      run: |
        main_binary="build/Build/Products/Release/${APP_NAME}.app/Contents/MacOS/${APP_NAME}"
        python3 scripts/compiled-source-audit.py "$main_binary" \
          --arch "${{ matrix.archs }}" --self-test
        python3 scripts/compiled-source-audit.py "$main_binary" \
          --arch "${{ matrix.archs }}"

    - name: Package ${{ matrix.variant }} app bundle
      run: |
        mkdir -p dist/app
        cp -R "build/Build/Products/Release/${APP_NAME}.app" "dist/app/${APP_NAME}.app"
        ./scripts/codesign-bundle.sh "dist/app/${APP_NAME}.app"
        tar -czf "dist/Moonlight-macOS-${{ matrix.variant }}.app.tar.gz" -C dist/app "${APP_NAME}.app"

    - name: Verify every binary the ${{ matrix.variant }} bundle embeds
      # The release shipped a main executable with no signature at all and two
      # frameworks whose old seals listed headers this build does not ship, so all
      # three failed `codesign --verify` -- and the bundle was not sealed either, so
      # nobody could tell a shipped app from a modified one. This reads the bundle the
      # tarball and the DMG are both made from.
      run: python3 scripts/launch-code-audit.py dist/app/${APP_NAME}.app --report-identity

    - name: Create ${{ matrix.variant }} DMG
      run: |
        brew install create-dmg || true

        create-dmg \
          --volname "Moonlight macOS Enhanced (${{ matrix.variant }})" \
          --volicon "dist/app/${APP_NAME}.app/Contents/Resources/AppIcon.icns" \
          --window-pos 200 120 \
          --window-size 600 400 \
          --icon-size 100 \
          --icon "${APP_NAME}.app" 150 185 \
          --hide-extension "${APP_NAME}.app" \
          --app-drop-link 450 185 \
          "dist/Moonlight-macOS-Enhanced-${{ matrix.variant }}.dmg" \
          "dist/app/${APP_NAME}.app" || \
        hdiutil create -volname "Moonlight-${{ matrix.variant }}" -srcfolder "dist/app/${APP_NAME}.app" -ov -format UDZO "dist/Moonlight-macOS-Enhanced-${{ matrix.variant }}.dmg"

    - name: Audit the ${{ matrix.variant }} DMG
      # Three questions the build log cannot answer. Does the image still hold the
      # bytes that were written (hdiutil verifies the image's own checksum); is there
      # an Applications drop target at its root (the `||` fallback above succeeds and
      # produces an image with none, which installs nothing and stays green); and is
      # the build number inside the image the one this commit resolved, rather than
      # one xcconfig quietly kept from an older build.
      run: |
        python3 scripts/dmg-audit.py \
          "dist/Moonlight-macOS-Enhanced-${{ matrix.variant }}.dmg" \
          --build "$BUILD_NUMBER_RESOLVED" --write-checksums

    - name: Upload ${{ matrix.variant }} app artifact
      uses: actions/upload-artifact@v7
      with:
        name: Moonlight-macOS-app-${{ matrix.variant }}
        path: dist/Moonlight-macOS-${{ matrix.variant }}.app.tar.gz
        if-no-files-found: error
        retention-days: 14

    - name: Upload ${{ matrix.variant }} DMG artifact
      uses: actions/upload-artifact@v7
      with:
        name: Moonlight-macOS-dmg-${{ matrix.variant }}
        path: dist/Moonlight-macOS-Enhanced-${{ matrix.variant }}.dmg
        if-no-files-found: error
        retention-days: 14

    - name: Upload ${{ matrix.variant }} DMG checksum
      # A separate artifact on purpose: the DMG artifact keeps holding exactly one
      # file, so whatever consumes it today keeps consuming it unchanged.
      uses: actions/upload-artifact@v7
      with:
        name: Moonlight-macOS-checksum-${{ matrix.variant }}
        path: dist/Moonlight-macOS-Enhanced-${{ matrix.variant }}.dmg.sha256
        if-no-files-found: error
        retention-days: 14

  build_universal:
    timeout-minutes: 20  # two downloads, one lipo merge, one DMG
    name: Build universal
    needs: build_arch
    runs-on: macos-26

    steps:
    - name: Checkout
      # The job assembles its app bundle from two downloaded artifacts, so its
      # workspace would otherwise hold no repository at all -- and the class-table
      # gate below is a script out of the repository. It failed with "No such file
      # or directory", which is a red that says nothing about the merge. Rule WF021
      # now refuses that shape wherever it is written again.
      uses: actions/checkout@v6

    - name: Read the product name from the project
      # Every path below -- the bundle copy, the codesign target, the tar member, the DMG
      # icon and drop positions -- has to name the bundle the project decides to build.
      # A literal in this file would be a second source of truth, and the day the product
      # is renamed one of these lines would keep packaging the old name (upstream issue 41
      # is what two names for one bundle did to people's /Applications).
      run: echo "APP_NAME=$(./scripts/product-name.sh)" >> "$GITHUB_ENV"

    - name: Download arm64 app artifact
      uses: actions/download-artifact@v8
      with:
        name: Moonlight-macOS-app-arm64
        path: artifacts/arm64

    - name: Download x86_64 app artifact
      uses: actions/download-artifact@v8
      with:
        name: Moonlight-macOS-app-x86_64
        path: artifacts/x86_64

    - name: Extract app bundles
      run: |
        mkdir -p work/arm64 work/x86_64 dist
        tar -xzf "artifacts/arm64/Moonlight-macOS-arm64.app.tar.gz" -C work/arm64
        tar -xzf "artifacts/x86_64/Moonlight-macOS-x86_64.app.tar.gz" -C work/x86_64

    - name: Merge universal app bundle
      run: |
        mkdir -p dist/universal
        rsync -a "work/arm64/${APP_NAME}.app/" "dist/universal/${APP_NAME}.app/"

        export ARM_APP="$PWD/work/arm64/${APP_NAME}.app"
        export X86_APP="$PWD/work/x86_64/${APP_NAME}.app"
        export UNIVERSAL_APP="$PWD/dist/universal/${APP_NAME}.app"

        python3 <<'PY'
        import os
        import shutil
        import subprocess
        import sys
        from pathlib import Path

        arm_app = Path(os.environ["ARM_APP"])
        x86_app = Path(os.environ["X86_APP"])
        universal_app = Path(os.environ["UNIVERSAL_APP"])
        expected_archs = {"arm64", "x86_64"}

        def file_description(path: Path) -> str:
            return subprocess.check_output(["file", "-b", str(path)], text=True).strip()

        def is_macho(path: Path) -> bool:
            return "Mach-O" in file_description(path)

        def archs(path: Path) -> set[str]:
            return set(subprocess.check_output(["lipo", "-archs", str(path)], text=True).split())

        relpaths: set[Path] = set()
        for root in (arm_app, x86_app):
            for path in root.rglob("*"):
                if path.is_symlink() or not path.is_file():
                    continue
                relpaths.add(path.relative_to(root))

        for relpath in sorted(relpaths):
            arm_path = arm_app / relpath
            x86_path = x86_app / relpath
            dest_path = universal_app / relpath

            existing_path = arm_path if arm_path.exists() else x86_path
            if existing_path.is_symlink() or not existing_path.is_file():
                continue

            if not is_macho(existing_path):
                if not dest_path.exists() and existing_path.exists():
                    dest_path.parent.mkdir(parents=True, exist_ok=True)
                    shutil.copy2(existing_path, dest_path)
                continue

            if not arm_path.exists() or not x86_path.exists():
                print(f"Missing counterpart while merging Mach-O file: {relpath}", file=sys.stderr)
                sys.exit(1)

            arm_archs = archs(arm_path)
            x86_archs = archs(x86_path)

            if arm_archs == expected_archs:
                continue

            if x86_archs == expected_archs:
                shutil.copy2(x86_path, dest_path)
                continue

            if (arm_archs | x86_archs) != expected_archs:
                print(
                    f"Unexpected architecture union for {relpath}: arm={sorted(arm_archs)} x86={sorted(x86_archs)}",
                    file=sys.stderr,
                )
                sys.exit(1)

            dest_path.parent.mkdir(parents=True, exist_ok=True)
            subprocess.check_call(["lipo", "-create", str(arm_path), str(x86_path), "-output", str(dest_path)])
        PY

    - name: Verify universal binary slices
      run: |
        app_bundle="dist/universal/${APP_NAME}.app"
        main_binary="$app_bundle/Contents/MacOS/${APP_NAME}"
        # Same derivation as the per-architecture job above.
        bundle_id="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app_bundle/Contents/Info.plist")"
        echo "Bundle identifier: $bundle_id"
        helper_binary="$app_bundle/Contents/Library/LaunchServices/${bundle_id}.AwdlPrivilegedHelper"

        lipo -info "$main_binary"
        lipo -info "$helper_binary"

        main_archs="$(lipo -archs "$main_binary")"
        helper_archs="$(lipo -archs "$helper_binary")"

        if [[ "$main_archs" != *"arm64"* || "$main_archs" != *"x86_64"* ]]; then
          echo "Universal main binary missing expected slices"
          exit 1
        fi

        if [[ "$helper_archs" != *"arm64"* || "$helper_archs" != *"x86_64"* ]]; then
          echo "Universal helper binary missing expected slices"
          exit 1
        fi

    - name: Verify the merged binary lost no class
      # A universal merge is a file-by-file copy of one slice over another, so a
      # dropped or half-merged binary shows up as a class that exists in a slice
      # and not in the artifact. Both slices are read, because the merge can lose
      # either one.
      run: |
        main_binary="dist/universal/${APP_NAME}.app/Contents/MacOS/${APP_NAME}"
        for arch in arm64 x86_64; do
          python3 scripts/compiled-source-audit.py "$main_binary" --arch "$arch"
        done

    - name: Sign the merged bundle
      # A universal merge is `lipo -create` over two signed binaries, which produces a
      # fat file whose slices carry the wrong hashes -- this is where the shipped
      # frameworks got the seals that failed verification. The merged bundle is signed
      # after the merge and before anything is made from it.
      run: ./scripts/codesign-bundle.sh dist/universal/${APP_NAME}.app

    - name: Verify every binary the universal bundle embeds
      run: python3 scripts/launch-code-audit.py dist/universal/${APP_NAME}.app --report-identity

    - name: Create universal DMG
      run: |
        brew install create-dmg || true

        create-dmg \
          --volname "Moonlight macOS Enhanced (universal)" \
          --volicon "dist/universal/${APP_NAME}.app/Contents/Resources/AppIcon.icns" \
          --window-pos 200 120 \
          --window-size 600 400 \
          --icon-size 100 \
          --icon "${APP_NAME}.app" 150 185 \
          --hide-extension "${APP_NAME}.app" \
          --app-drop-link 450 185 \
          "dist/Moonlight-macOS-Enhanced-universal.dmg" \
          "dist/universal/${APP_NAME}.app" || \
        hdiutil create -volname "Moonlight-universal" -srcfolder "dist/universal/${APP_NAME}.app" -ov -format UDZO "dist/Moonlight-macOS-Enhanced-universal.dmg"

    - name: Audit the universal DMG
      # The expected build number comes from the arm64 bundle the merge started with,
      # not from the merged one, so an image that was made from a stale copy of the
      # app -- or from the other side's plist after the merge overwrote it -- is
      # refused here instead of at the release page.
      run: |
        expected_build="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' \
          work/arm64/${APP_NAME}.app/Contents/Info.plist)"
        echo "arm64 slice build: $expected_build"
        python3 scripts/dmg-audit.py \
          "dist/Moonlight-macOS-Enhanced-universal.dmg" \
          --build "$expected_build" --write-checksums

    - name: Upload universal DMG checksum
      uses: actions/upload-artifact@v7
      with:
        name: Moonlight-macOS-checksum-universal
        path: dist/Moonlight-macOS-Enhanced-universal.dmg.sha256
        if-no-files-found: error
        retention-days: 14

    - name: Upload universal DMG artifact
      uses: actions/upload-artifact@v7
      with:
        name: Moonlight-macOS-dmg-universal
        path: dist/Moonlight-macOS-Enhanced-universal.dmg
        if-no-files-found: error
        retention-days: 14

  analyze:
    timeout-minutes: 30  # a cold derived-data scan of the whole tree
    name: Static analyzer
    needs: audit
    runs-on: macos-26

    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Setup Xcode
      # Pinned to a commit rather than the moving v1 tag: this step runs before the
      # compiler on every build job and decides which toolchain the build sees.
      # ed7a3b1 == v1
      uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90
      with:
        xcode-version: latest-stable

    - name: Prepare vendored dependencies
      run: |
        ./scripts/download-frameworks.sh

    - name: Analyze the project sources
      # The analyzer sees the thing a reviewer cannot see in a diff: a CoreFoundation
      # reference created in one method and released in nobody's method. It found a
      # CGEvent leaked on every gamepad navigation press, a CGPath whose +1
      # reference one caller released and another leaked on every shadow refresh,
      # and the HID manager left scheduled with callbacks into a freed object.
      # Run it on a cold cache so every file is really analysed.
      run: |
        set -o pipefail
        xcodebuild \
          -project Moonlight.xcodeproj \
          -scheme "Moonlight for macOS" \
          -configuration Debug \
          -destination 'platform=macOS,arch=arm64' \
          -derivedDataPath "$RUNNER_TEMP/analyze" \
          analyze 2>&1 | tee "$RUNNER_TEMP/analyze.log"

    - name: Verify no finding was added
      # Compared against scripts/analyzer-baseline.json by file, checker and message
      # shape. The audit refuses a sweep that did not run, because an analyzer that
      # analysed nothing reports nothing, and this repository has twice mistaken that
      # silence for cleanliness.
      run: python3 scripts/analyzer-audit.py --log "$RUNNER_TEMP/analyze.log"

    - name: Type-check the project sources against this image's SDK
      # The analyzer reads the tree; this compiles it. A property declared only in a
      # newer SDK than the image's once reached three failing jobs while the developer's
      # machine -- which had that newer SDK -- reported clean, because which answer is
      # right is decided by the SDK doing the checking. So the check runs here, on the
      # image that ships the app, against the derived data the analyze step just made.
      run: |
        python3 scripts/compile-audit.py --self-test --derived "$RUNNER_TEMP/analyze"
        python3 scripts/compile-audit.py --derived "$RUNNER_TEMP/analyze"

    - name: Type-check the Swift sources against this image's SDK
      # The step above compiles the Objective-C half of the app. Nothing compiled the
      # Swift half: a fix that asked an NSResponder which window it belonged to -- a
      # question only a view, or the window itself, can answer -- passed the syntax
      # parse, passed every source rule in this file, and was refused by three jobs.
      # Twelve minutes was the only latency this tree had for a Swift type error, so
      # the same check the C half already had is extended to the half that lacked it,
      # with the project's own bridging header and the same vendored include paths.
      # Where a host has no macro plugin for a region, the region is named; a check
      # that quietly stops reading part of the tree is worth less than none. It is
      # pointed at the same derived data the compile step above is given, because the
      # generated headers it reads are xcodebuild's and live wherever the build was
      # told to go -- which on a runner is outside the checkout.
      run: |
        python3 scripts/swift-typecheck.py --self-test
        python3 scripts/swift-typecheck.py --derived "$RUNNER_TEMP/analyze"

    - name: Upload the analyzer transcript
      # The baseline is keyed by file, checker and message shape, so a different
      # clang can legitimately disagree about a finding. The transcript is what
      # makes that arguable instead of mysterious, and it is the only record of a
      # sweep that no longer exists once the runner is gone.
      if: failure()
      # The same version as every other upload in this file. A tag resolves per job,
      # so a step left behind on an older major keeps working while it quietly runs
      # different code from the steps that consume what it wrote -- and the major
      # GitHub retires is the one that turns this step's failure() path into a second,
      # unrelated red job. workflow-audit rule WF025 keeps the file on one version.
      uses: actions/upload-artifact@v7
      with:
        name: analyzer-transcript
        path: ${{ runner.temp }}/analyze.log
        if-no-files-found: error
        retention-days: 14

  build:
    timeout-minutes: 10  # it reads three job results and prints them
    name: build
    needs: [build_arch, build_universal, analyze]
    runs-on: ubuntu-latest
    if: always()

    steps:
    - name: Verify required build jobs
      run: |
        echo "build_arch result: ${{ needs.build_arch.result }}"
        echo "build_universal result: ${{ needs.build_universal.result }}"
        echo "analyze result: ${{ needs.analyze.result }}"

        if [ "${{ needs.build_arch.result }}" != "success" ]; then
          echo "build_arch did not succeed"
          exit 1
        fi

        if [ "${{ needs.build_universal.result }}" != "success" ]; then
          echo "build_universal did not succeed"
          exit 1
        fi

        if [ "${{ needs.analyze.result }}" != "success" ]; then
          echo "the static analyzer job did not succeed"
          exit 1
        fi

        echo "All required build jobs passed."

  verify_images:
    timeout-minutes: 15  # three disk images downloaded and hashed, no toolchain
    name: Verify the published images
    needs: [build_arch, build_universal, build]
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Download the DMG artifacts
      uses: actions/download-artifact@v8
      with:
        pattern: Moonlight-macOS-dmg-*
        path: dist
        merge-multiple: true

    - name: Download the DMG checksum artifacts
      uses: actions/download-artifact@v8
      with:
        pattern: Moonlight-macOS-checksum-*
        path: checksums
        merge-multiple: true

    - name: Verify the images against the checksums taken when they were built
      # This is the release job's check, run on every push, on the artifacts the
      # release job would publish. It is the only way the release path gets exercised
      # before a tag exists: the download pattern, the checksum glob, and the audit's
      # refusal of a missing image all fail here rather than on release day.
      run: ./scripts/verify-release-images.sh checksums dist

  release:
    timeout-minutes: 30  # tag, notes, and a 10 MB asset upload
    needs: [build_arch, build_universal, build, verify_images]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Download x86_64 DMG artifact
      uses: actions/download-artifact@v8
      with:
        name: Moonlight-macOS-dmg-x86_64
        path: dist

    - name: Download arm64 DMG artifact
      uses: actions/download-artifact@v8
      with:
        name: Moonlight-macOS-dmg-arm64
        path: dist

    - name: Download universal DMG artifact
      uses: actions/download-artifact@v8
      with:
        name: Moonlight-macOS-dmg-universal
        path: dist

    - name: Download the DMG checksum artifacts
      uses: actions/download-artifact@v8
      with:
        pattern: Moonlight-macOS-checksum-*
        path: checksums
        merge-multiple: true

    - name: Verify the bytes being released are the bytes that were built
      # The same line the rehearsal job runs on every push. A release job only runs on
      # a tag, so a check written only here would be exercised for the first time while
      # it was publishing something people install.
      run: ./scripts/verify-release-images.sh checksums dist

    - name: Gate the release tag
      # The version in the release title has to be the version inside the DMGs.
      # A tag that disagrees with MARKETING_VERSION, with the build number this
      # commit generates, with the changelog, or with an earlier release would
      # publish an installable package whose identity is wrong, and the only fix
      # afterwards is to withdraw a release people have already installed.
      env:
        TAG: ${{ github.ref_name }}
      run: |
        git fetch --force --tags --quiet
        python3 scripts/release-gate.py \
          --tag "$TAG" \
          --existing-tags "$(git tag --list 'v*' | paste -sd, -)"

    - name: Get Version
      id: version
      run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

    - name: Build Release Body
      env:
        VERSION: ${{ steps.version.outputs.VERSION }}
        GITHUB_REPOSITORY: ${{ github.repository }}
      run: |
        python3 .github/scripts/build_release_body.py

    - name: Create Release
      # The one step holding contents: write, so the one step pinned to an immutable
      # commit instead of a tag its maintainer can repoint.
      # efb3536 == v3
      uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
      with:
        name: ${{ steps.version.outputs.VERSION }}
        draft: false
        prerelease: ${{ contains(github.ref, 'beta') || contains(github.ref, 'alpha') }}
        files: |
          dist/Moonlight-macOS-Enhanced-x86_64.dmg
          dist/Moonlight-macOS-Enhanced-arm64.dmg
          dist/Moonlight-macOS-Enhanced-universal.dmg
          dist/Moonlight-macOS-Enhanced-x86_64.dmg.sha256
          dist/Moonlight-macOS-Enhanced-arm64.dmg.sha256
          dist/Moonlight-macOS-Enhanced-universal.dmg.sha256
        body_path: release_body.md
