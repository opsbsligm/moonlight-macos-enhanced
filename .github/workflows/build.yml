name: Build and Release

on:
  push:
    # master and main, plus the integration branches this repository actually works
    # on. Verifying a push to pr-overhaul used to mean remembering to press Run
    # workflow: six times in one morning, each a full macOS matrix started by hand,
    # each a red that arrived minutes after the commit instead of at it.
    branches: [master, main, 'pr-*', 'integration/*']
    tags:
      - 'v*'
  pull_request:
    branches: [master, main]
  workflow_dispatch:

# Every job starts read-only on repository contents. The release job raises it
# to write for itself alone, so a build step handed untrusted input cannot
# rewrite the repository.
permissions:
  contents: read

# One live run per pull request or ref. A new push replaces its predecessor
# instead of queueing a second full macOS matrix, and a tag release is never
# cancelled underneath by a later push.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # A push to a working branch supersedes the commit before it, so the older run is
  # worth cancelling: re-verifying a commit nobody will ship costs ten macOS minutes
  # for no information. Trunk and tags are different animals -- a release in progress
  # is never cancelled underneath someone.
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' && github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}


jobs:
  # Cheap repository audits that do not need Xcode. They gate every build job
  # so a broken tree fails in seconds instead of after a full matrix build.
  audit:
    timeout-minutes: 15  # seconds of grep plus the mutation battery
    name: Repository audits
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Set up Python for the audits
      # The workflow audit needs PyYAML, which the runner image does not promise.
      # A guard that silently loses its parser is worse than no guard, because it
      # reports success while checking nothing. One pinned interpreter and one
      # pinned parser keep the failure loud.
      uses: actions/setup-python@v6
      with:
        python-version: "3.12"

    - name: Install the parser used by the workflow audit
      run: python3 -m pip install --quiet --disable-pip-version-check pyyaml==6.0.2

    - name: Verify localization coverage
      run: python3 scripts/l10n-audit.py

    - name: Verify every source file is compiled
      run: python3 scripts/source-membership-audit.py

    - name: Verify project constraints
      run: python3 scripts/constraints-audit.py

    - name: Verify the liquid glass rules
      # A glass look can be faked with a blur and a material, and the fake passes
      # a code review and a build. These rules are checked against fixtures that
      # break each one, then against the real glass surface.
      run: |
        python3 scripts/liquid-glass-audit.py --self-test
        python3 scripts/liquid-glass-audit.py

    - name: Verify the published-image checksum rule
      # A release page that hands out a DMG nobody hashed is a download nobody can
      # check. This half of the DMG gate runs anywhere, because a checksum is not a
      # filesystem question; the mount half runs on the macOS job that builds the
      # image, and both halves are wired into the local aggregate.
      run: python3 scripts/dmg-audit.py --self-test-checksums

    - name: Verify the release tag rule set
      # The gate below only helps if its rules are exercised on every change.
      # These fixtures are the only place the accept path is checked, because on
      # any given commit the real tree usually refuses every candidate tag.
      run: python3 scripts/release-gate.py --self-test

    - name: Verify the workflow can actually run
      # A plain yaml.safe_load accepts a step whose run: key was dropped, and a
      # step with two run: keys. GitHub accepts neither: the run turns red before
      # any job exists, so the pipeline reports failure with no job list and no
      # log. These rules cover what a parse cannot see.
      run: |
        python3 scripts/workflow-audit.py --self-test
        python3 scripts/workflow-audit.py
        for script in scripts/*.sh; do
          bash -n "$script"
          echo "shell syntax ok: $script"
        done

  build_arch:
    timeout-minutes: 45  # a cross-compile, seven harnesses and a DMG
    name: Build ${{ matrix.variant }}
    needs: audit
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: arm64
            # "macos-26-arm64" is the image name in the runner-images docs, not
            # a label. The label that selects the arm64 machine is macos-26, and
            # a runs-on that names the image matches no hosted runner: the job
            # then sits queued with no failure and no log to read.
            runner: macos-26
            destination: 'platform=macOS,arch=arm64'
            archs: 'arm64'
            display_name: Apple Silicon
          - variant: x86_64
            # x86_64 is cross-compiled on the arm64 image on purpose. Intel
            # macOS is hosted, as macos-26-intel and macos-26-large, but using
            # it would tie every release to a second machine class for no
            # benefit: each vendored xcframework ships a
            # macos-arm64_x86_64 slice, so the x86_64 link is satisfied from an
            # arm64 runner.
            runner: macos-26
            destination: 'platform=macOS,arch=x86_64'
            archs: 'x86_64'
            display_name: Intel

    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Setup Xcode
      # Pinned to a commit rather than the moving v1 tag: this step runs before the
      # compiler on every build job and decides which toolchain the build sees.
      # ed7a3b1 == v1
      uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90
      with:
        xcode-version: latest-stable

    - name: Show Build Environment
      run: |
        xcodebuild -version
        swift --version
        uname -m
        echo "Available schemes:"
        xcodebuild -list -project Moonlight.xcodeproj || true

    - name: Prepare vendored dependencies
      # Run the same script a developer runs. This step used to duplicate the
      # xcframework download inline, which drifted away from the script and left
      # Packages/OpenSSL.xcframework and the libs/openssl header symlink absent
      # on every runner, so both were missing before the compiler could report
      # anything. One shared entry point keeps the two environments identical.
      run: |
        ./scripts/download-frameworks.sh
        ls -la xcframeworks/
        ls -la Packages/OpenSSL.xcframework/
        ls -la libs/

    - name: Resolve build number
      # build-number.sh is a scheme PreAction and command-line xcodebuild ignores
      # PreActions; the #include? in Version.xcconfig cannot resolve
      # $(DERIVED_FILE_DIR) at parse time either. Command-line settings outrank
      # every xcconfig, so the resolved value has to be injected there.
      run: |
        echo "BUILD_NUMBER_RESOLVED=$(sh Limelight/build-number.sh --print)" >> "$GITHUB_ENV"
        echo "resolved BUILD_NUMBER=$(sh Limelight/build-number.sh --print)"

    - name: Verify input concurrency invariants
      # The pointer delta handoff between the GameController callback queue and
      # the CVDisplayLink output callback crosses threads. A compound update on
      # an atomic property compiles, links and ships with no signal at all, so
      # the only protection is a behavioural check. The harness extracts the
      # implementation from Limelight/Input, runs it in the real topology and a
      # wider one, then rebuilds the previous semantics to prove the check
      # still notices the race.
      run: python3 scripts/input-concurrency-tests.py

    - name: Verify two keys held at once
      # Pressing W and Space together -- walk and jump -- is the report this
      # gate exists for. A held-key table with the right words in it can still
      # tangle two concurrent keys, and neither the compiler nor a reviewer
      # notices. The harness extracts the state machine from Limelight/Input,
      # drives it with real NSEvents in the shapes a pair of hands produces, and
      # rebuilds the pre-fix shape to prove the scenarios can fail.
      run: python3 scripts/keyboard-concurrency-tests.py

    - name: Verify the modifier mapping sends the key that was pressed
      # This module is the single source of truth for Command-to-Win, Control-to-Ctrl,
      # Option-to-Alt and Shift-to-Shift, each side to its own side, and it was the one
      # part of the input pipeline with no test, no constraint and no scenario naming it
      # at all. A table entry pointing at the wrong side, or two mac keys collapsing onto
      # one remote key, would have shipped silently and arrived as "my keyboard feels
      # wrong in games". The harness compiles the shipped file, walks all eight modifier
      # keys through keycode to physical slot to remote bit to Windows virtual key, and
      # checks the virtual keys against values written out in the harness rather than
      # against the same table. Two planted variants -- both hands of a modifier
      # answering as the left hand, and the flags path answering Command with Alt --
      # have to fail the same scenarios.
      run: python3 scripts/keyboard-modifier-mapping-tests.py

    - name: Verify a shortcut cannot drop a modifier the player is holding
      # A mouse-driven translation rule fires its shortcut by hand: it presses its
      # modifiers, fires its key, then lets its modifiers go. When the player is holding
      # one of those modifiers for real -- Shift to sprint, a Shift+Tab rule -- the rule
      # released it, and because the physical modifier tracker was not part of that
      # hand-written packet sequence, the diff on the next event came out zero and no
      # corrective press was ever sent. The player kept Shift down and the game had
      # stopped sprinting, with nothing logged on either side. The harness extracts the
      # shipping state machine and both synthetic paths, compiles them against the real
      # resolver, and asserts two things per scenario: the packets the host would
      # receive, and that the app's own tracker still matches what the host holds. The
      # unconditional-release shape has to fail those scenarios.
      run: python3 scripts/keyboard-shortcut-modifier-tests.py

    - name: Verify the stream's panels get real glass
      # Seven overlays drew the pre-glass HUD-window vibrancy, so the surfaces a player
      # looks at during a session were the part of the interface that never moved to the
      # liquid-glass APIs while settings and the tab bar had. The container in
      # Limelight/macOS/Views answers that once, and this compiles and runs it to report
      # what it really built: the background class behind the content, whether the corner
      # radius reached it, whether the content still covers the panel instead of being
      # inset by the glass rim -- the panels lay their controls out by frame, so an inset
      # would move every control in the log browser -- and what the Core Animation tree
      # underneath is made of. The glass-less shape has to be refused on a host that has
      # glass, which is what makes the availability branch a behaviour and not a claim.
      run: python3 scripts/liquid-glass-overlay-tests.py

    - name: Verify the timeout overlay can reach its submenus
      # The overlay's three buttons used to find the stream menu's Window, Monitor
      # and Quality submenus by comparing each item's title against a Chinese
      # literal. The titles are localized, so in the English interface the
      # comparison matched nothing, popUpMenuPositioningItem: was never reached, and
      # Resolution, Bitrate and Display Mode did nothing at all -- no crash, no log
      # line, no build failure. A source grep for the word it compared against would
      # have stayed satisfied the whole time. The harness compiles the lookup that
      # ships, hands it menus carrying both languages' titles, and rebuilds the old
      # title comparison to prove the English case can still fail.
      run: python3 scripts/stream-menu-addressing-tests.py

    - name: Verify the settings page renders embedded
      # Goals that are visual cannot be signed off by a compile, and the two
      # visual goals here were waiting on a human eye that was not available. The
      # app carries a Debug-only entry point, inert unless ML_RENDER_PROBE is set,
      # which drives the production settings presenter and measures the result:
      # no second window, the page inside that same window's content, the fade
      # finished, dismissal clean, real pixels drawn, and a Core Animation
      # backdrop layer present so a glass material is actually composited. The run
      # gets its own HOME, so its database and preferences are its own.
      run: python3 scripts/render-probe.py --timeout 1500

    - name: Verify video enhancement paths
      # MetalFX scaling and VT frame interpolation are both object-creation
      # APIs: the call succeeds, the build stays green and the feature can still
      # do nothing. The probe rescales a test pattern on the GPU and counts
      # interpolated edge pixels, then reads the interpolation slot count back
      # out of the configuration, because a machine with no interpolation
      # hardware still creates the configuration and still starts the session.
      run: python3 scripts/video-enhancement-tests.py

    - name: Build ${{ matrix.display_name }} package
      run: |
        set -o pipefail
        xcodebuild -project Moonlight.xcodeproj \
          -scheme "Moonlight for macOS" \
          -configuration Release \
          -derivedDataPath build \
          -destination "${{ matrix.destination }}" \
          ARCHS="${{ matrix.archs }}" \
          ONLY_ACTIVE_ARCH=YES \
          CODE_SIGN_IDENTITY="-" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          BUILD_NUMBER="$BUILD_NUMBER_RESOLVED" \
          build 2>&1 | tee "build-${{ matrix.variant }}.log"

    - name: Fail on warnings in project sources
      # Vendored third-party headers (OpenSSL umbrella headers, moonlight-common,
      # xcframeworks) keep their own diagnostics; first-party code must stay clean.
      run: |
        set -o pipefail
        if grep -E 'warning: ' "build-${{ matrix.variant }}.log" \
          | grep -vE 'xcframeworks/|moonlight-common|Packages/|libs/openssl|libs/OpenSSL|appintentsmetadataprocessor|libtool' \
          | grep -qE 'Limelight/'; then
          echo "::error::compiler warnings in first-party sources"
          exit 1
        fi
        echo "first-party sources are warning-free"

    - name: Verify ${{ matrix.variant }} binary slices
      run: |
        app_bundle="build/Build/Products/Release/Moonlight.app"
        main_binary="$app_bundle/Contents/MacOS/Moonlight"
        # Derive the helper name from the built bundle instead of hardcoding it.
        # The build phase names the helper "$(PRODUCT_BUNDLE_IDENTIFIER).AwdlPrivilegedHelper",
        # so a bundle id change used to break this check silently in both arch jobs.
        bundle_id="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app_bundle/Contents/Info.plist")"
        echo "Bundle identifier: $bundle_id"
        helper_binary="$app_bundle/Contents/Library/LaunchServices/${bundle_id}.AwdlPrivilegedHelper"

        lipo -info "$main_binary"
        file "$main_binary"

        if [ ! -f "$helper_binary" ]; then
          echo "Expected AWDL helper at $helper_binary"
          exit 1
        fi

        lipo -info "$helper_binary"
        file "$helper_binary"

        main_archs="$(lipo -archs "$main_binary")"
        helper_archs="$(lipo -archs "$helper_binary")"
        echo "Main binary architectures: $main_archs"
        echo "Helper binary architectures: $helper_archs"

        if [[ "$main_archs" != *"${{ matrix.archs }}"* ]]; then
          echo "Main binary missing expected architecture ${{ matrix.archs }}"
          exit 1
        fi

        if [[ "$helper_archs" != *"${{ matrix.archs }}"* ]]; then
          echo "Helper binary missing expected architecture ${{ matrix.archs }}"
          exit 1
        fi

    - name: Verify every source file reached the ${{ matrix.variant }} binary
      # The project file lists every source it intends to compile, which is a
      # claim about the build rather than the build. GlassOverlayContainer.m
      # compiled on its own in a harness, was absent from that list, and appeared
      # in no binary that anyone shipped: no target compiled it, so no target
      # failed. This reads the class table of the linked Mach-O instead, where a
      # file that nothing compiled cannot hide.
      run: |
        main_binary="build/Build/Products/Release/Moonlight.app/Contents/MacOS/Moonlight"
        python3 scripts/compiled-source-audit.py "$main_binary" \
          --arch "${{ matrix.archs }}" --self-test
        python3 scripts/compiled-source-audit.py "$main_binary" \
          --arch "${{ matrix.archs }}"

    - name: Package ${{ matrix.variant }} app bundle
      run: |
        mkdir -p dist/app
        cp -R "build/Build/Products/Release/Moonlight.app" "dist/app/Moonlight.app"
        ./scripts/codesign-bundle.sh "dist/app/Moonlight.app"
        tar -czf "dist/Moonlight-macOS-${{ matrix.variant }}.app.tar.gz" -C dist/app Moonlight.app

    - name: Verify every binary the ${{ matrix.variant }} bundle embeds
      # The release shipped a main executable with no signature at all and two
      # frameworks whose old seals listed headers this build does not ship, so all
      # three failed `codesign --verify` -- and the bundle was not sealed either, so
      # nobody could tell a shipped app from a modified one. This reads the bundle the
      # tarball and the DMG are both made from.
      run: python3 scripts/launch-code-audit.py dist/app/Moonlight.app --report-identity

    - name: Create ${{ matrix.variant }} DMG
      run: |
        brew install create-dmg || true

        create-dmg \
          --volname "Moonlight macOS Enhanced (${{ matrix.variant }})" \
          --volicon "dist/app/Moonlight.app/Contents/Resources/AppIcon.icns" \
          --window-pos 200 120 \
          --window-size 600 400 \
          --icon-size 100 \
          --icon "Moonlight.app" 150 185 \
          --hide-extension "Moonlight.app" \
          --app-drop-link 450 185 \
          "dist/Moonlight-macOS-Enhanced-${{ matrix.variant }}.dmg" \
          "dist/app/Moonlight.app" || \
        hdiutil create -volname "Moonlight-${{ matrix.variant }}" -srcfolder "dist/app/Moonlight.app" -ov -format UDZO "dist/Moonlight-macOS-Enhanced-${{ matrix.variant }}.dmg"

    - name: Audit the ${{ matrix.variant }} DMG
      # Three questions the build log cannot answer. Does the image still hold the
      # bytes that were written (hdiutil verifies the image's own checksum); is there
      # an Applications drop target at its root (the `||` fallback above succeeds and
      # produces an image with none, which installs nothing and stays green); and is
      # the build number inside the image the one this commit resolved, rather than
      # one xcconfig quietly kept from an older build.
      run: |
        python3 scripts/dmg-audit.py \
          "dist/Moonlight-macOS-Enhanced-${{ matrix.variant }}.dmg" \
          --build "$BUILD_NUMBER_RESOLVED" --write-checksums

    - name: Upload ${{ matrix.variant }} app artifact
      uses: actions/upload-artifact@v7
      with:
        name: Moonlight-macOS-app-${{ matrix.variant }}
        path: dist/Moonlight-macOS-${{ matrix.variant }}.app.tar.gz
        if-no-files-found: error
        retention-days: 14

    - name: Upload ${{ matrix.variant }} DMG artifact
      uses: actions/upload-artifact@v7
      with:
        name: Moonlight-macOS-dmg-${{ matrix.variant }}
        path: dist/Moonlight-macOS-Enhanced-${{ matrix.variant }}.dmg
        if-no-files-found: error
        retention-days: 14

    - name: Upload ${{ matrix.variant }} DMG checksum
      # A separate artifact on purpose: the DMG artifact keeps holding exactly one
      # file, so whatever consumes it today keeps consuming it unchanged.
      uses: actions/upload-artifact@v7
      with:
        name: Moonlight-macOS-checksum-${{ matrix.variant }}
        path: dist/Moonlight-macOS-Enhanced-${{ matrix.variant }}.dmg.sha256
        if-no-files-found: error
        retention-days: 14

  build_universal:
    timeout-minutes: 20  # two downloads, one lipo merge, one DMG
    name: Build universal
    needs: build_arch
    runs-on: macos-26

    steps:
    - name: Checkout
      # The job assembles its app bundle from two downloaded artifacts, so its
      # workspace would otherwise hold no repository at all -- and the class-table
      # gate below is a script out of the repository. It failed with "No such file
      # or directory", which is a red that says nothing about the merge. Rule WF021
      # now refuses that shape wherever it is written again.
      uses: actions/checkout@v6

    - name: Download arm64 app artifact
      uses: actions/download-artifact@v8
      with:
        name: Moonlight-macOS-app-arm64
        path: artifacts/arm64

    - name: Download x86_64 app artifact
      uses: actions/download-artifact@v8
      with:
        name: Moonlight-macOS-app-x86_64
        path: artifacts/x86_64

    - name: Extract app bundles
      run: |
        mkdir -p work/arm64 work/x86_64 dist
        tar -xzf "artifacts/arm64/Moonlight-macOS-arm64.app.tar.gz" -C work/arm64
        tar -xzf "artifacts/x86_64/Moonlight-macOS-x86_64.app.tar.gz" -C work/x86_64

    - name: Merge universal app bundle
      run: |
        mkdir -p dist/universal
        rsync -a "work/arm64/Moonlight.app/" "dist/universal/Moonlight.app/"

        export ARM_APP="$PWD/work/arm64/Moonlight.app"
        export X86_APP="$PWD/work/x86_64/Moonlight.app"
        export UNIVERSAL_APP="$PWD/dist/universal/Moonlight.app"

        python3 <<'PY'
        import os
        import shutil
        import subprocess
        import sys
        from pathlib import Path

        arm_app = Path(os.environ["ARM_APP"])
        x86_app = Path(os.environ["X86_APP"])
        universal_app = Path(os.environ["UNIVERSAL_APP"])
        expected_archs = {"arm64", "x86_64"}

        def file_description(path: Path) -> str:
            return subprocess.check_output(["file", "-b", str(path)], text=True).strip()

        def is_macho(path: Path) -> bool:
            return "Mach-O" in file_description(path)

        def archs(path: Path) -> set[str]:
            return set(subprocess.check_output(["lipo", "-archs", str(path)], text=True).split())

        relpaths: set[Path] = set()
        for root in (arm_app, x86_app):
            for path in root.rglob("*"):
                if path.is_symlink() or not path.is_file():
                    continue
                relpaths.add(path.relative_to(root))

        for relpath in sorted(relpaths):
            arm_path = arm_app / relpath
            x86_path = x86_app / relpath
            dest_path = universal_app / relpath

            existing_path = arm_path if arm_path.exists() else x86_path
            if existing_path.is_symlink() or not existing_path.is_file():
                continue

            if not is_macho(existing_path):
                if not dest_path.exists() and existing_path.exists():
                    dest_path.parent.mkdir(parents=True, exist_ok=True)
                    shutil.copy2(existing_path, dest_path)
                continue

            if not arm_path.exists() or not x86_path.exists():
                print(f"Missing counterpart while merging Mach-O file: {relpath}", file=sys.stderr)
                sys.exit(1)

            arm_archs = archs(arm_path)
            x86_archs = archs(x86_path)

            if arm_archs == expected_archs:
                continue

            if x86_archs == expected_archs:
                shutil.copy2(x86_path, dest_path)
                continue

            if (arm_archs | x86_archs) != expected_archs:
                print(
                    f"Unexpected architecture union for {relpath}: arm={sorted(arm_archs)} x86={sorted(x86_archs)}",
                    file=sys.stderr,
                )
                sys.exit(1)

            dest_path.parent.mkdir(parents=True, exist_ok=True)
            subprocess.check_call(["lipo", "-create", str(arm_path), str(x86_path), "-output", str(dest_path)])
        PY

    - name: Verify universal binary slices
      run: |
        app_bundle="dist/universal/Moonlight.app"
        main_binary="$app_bundle/Contents/MacOS/Moonlight"
        # Same derivation as the per-architecture job above.
        bundle_id="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app_bundle/Contents/Info.plist")"
        echo "Bundle identifier: $bundle_id"
        helper_binary="$app_bundle/Contents/Library/LaunchServices/${bundle_id}.AwdlPrivilegedHelper"

        lipo -info "$main_binary"
        lipo -info "$helper_binary"

        main_archs="$(lipo -archs "$main_binary")"
        helper_archs="$(lipo -archs "$helper_binary")"

        if [[ "$main_archs" != *"arm64"* || "$main_archs" != *"x86_64"* ]]; then
          echo "Universal main binary missing expected slices"
          exit 1
        fi

        if [[ "$helper_archs" != *"arm64"* || "$helper_archs" != *"x86_64"* ]]; then
          echo "Universal helper binary missing expected slices"
          exit 1
        fi

    - name: Verify the merged binary lost no class
      # A universal merge is a file-by-file copy of one slice over another, so a
      # dropped or half-merged binary shows up as a class that exists in a slice
      # and not in the artifact. Both slices are read, because the merge can lose
      # either one.
      run: |
        main_binary="dist/universal/Moonlight.app/Contents/MacOS/Moonlight"
        for arch in arm64 x86_64; do
          python3 scripts/compiled-source-audit.py "$main_binary" --arch "$arch"
        done

    - name: Sign the merged bundle
      # A universal merge is `lipo -create` over two signed binaries, which produces a
      # fat file whose slices carry the wrong hashes -- this is where the shipped
      # frameworks got the seals that failed verification. The merged bundle is signed
      # after the merge and before anything is made from it.
      run: ./scripts/codesign-bundle.sh dist/universal/Moonlight.app

    - name: Verify every binary the universal bundle embeds
      run: python3 scripts/launch-code-audit.py dist/universal/Moonlight.app --report-identity

    - name: Create universal DMG
      run: |
        brew install create-dmg || true

        create-dmg \
          --volname "Moonlight macOS Enhanced (universal)" \
          --volicon "dist/universal/Moonlight.app/Contents/Resources/AppIcon.icns" \
          --window-pos 200 120 \
          --window-size 600 400 \
          --icon-size 100 \
          --icon "Moonlight.app" 150 185 \
          --hide-extension "Moonlight.app" \
          --app-drop-link 450 185 \
          "dist/Moonlight-macOS-Enhanced-universal.dmg" \
          "dist/universal/Moonlight.app" || \
        hdiutil create -volname "Moonlight-universal" -srcfolder "dist/universal/Moonlight.app" -ov -format UDZO "dist/Moonlight-macOS-Enhanced-universal.dmg"

    - name: Audit the universal DMG
      # The expected build number comes from the arm64 bundle the merge started with,
      # not from the merged one, so an image that was made from a stale copy of the
      # app -- or from the other side's plist after the merge overwrote it -- is
      # refused here instead of at the release page.
      run: |
        expected_build="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' \
          work/arm64/Moonlight.app/Contents/Info.plist)"
        echo "arm64 slice build: $expected_build"
        python3 scripts/dmg-audit.py \
          "dist/Moonlight-macOS-Enhanced-universal.dmg" \
          --build "$expected_build" --write-checksums

    - name: Upload universal DMG checksum
      uses: actions/upload-artifact@v7
      with:
        name: Moonlight-macOS-checksum-universal
        path: dist/Moonlight-macOS-Enhanced-universal.dmg.sha256
        if-no-files-found: error
        retention-days: 14

    - name: Upload universal DMG artifact
      uses: actions/upload-artifact@v7
      with:
        name: Moonlight-macOS-dmg-universal
        path: dist/Moonlight-macOS-Enhanced-universal.dmg
        if-no-files-found: error
        retention-days: 14

  analyze:
    timeout-minutes: 30  # a cold derived-data scan of the whole tree
    name: Static analyzer
    needs: audit
    runs-on: macos-26

    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Setup Xcode
      # Pinned to a commit rather than the moving v1 tag: this step runs before the
      # compiler on every build job and decides which toolchain the build sees.
      # ed7a3b1 == v1
      uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90
      with:
        xcode-version: latest-stable

    - name: Prepare vendored dependencies
      run: |
        ./scripts/download-frameworks.sh

    - name: Analyze the project sources
      # The analyzer sees the thing a reviewer cannot see in a diff: a CoreFoundation
      # reference created in one method and released in nobody's method. It found a
      # CGEvent leaked on every gamepad navigation press, a CGPath whose +1
      # reference one caller released and another leaked on every shadow refresh,
      # and the HID manager left scheduled with callbacks into a freed object.
      # Run it on a cold cache so every file is really analysed.
      run: |
        set -o pipefail
        xcodebuild \
          -project Moonlight.xcodeproj \
          -scheme "Moonlight for macOS" \
          -configuration Debug \
          -destination 'platform=macOS,arch=arm64' \
          -derivedDataPath "$RUNNER_TEMP/analyze" \
          analyze 2>&1 | tee "$RUNNER_TEMP/analyze.log"

    - name: Verify no finding was added
      # Compared against scripts/analyzer-baseline.json by file, checker and message
      # shape. The audit refuses a sweep that did not run, because an analyzer that
      # analysed nothing reports nothing, and this repository has twice mistaken that
      # silence for cleanliness.
      run: python3 scripts/analyzer-audit.py --log "$RUNNER_TEMP/analyze.log"

    - name: Upload the analyzer transcript
      # The baseline is keyed by file, checker and message shape, so a different
      # clang can legitimately disagree about a finding. The transcript is what
      # makes that arguable instead of mysterious, and it is the only record of a
      # sweep that no longer exists once the runner is gone.
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: analyzer-transcript
        path: ${{ runner.temp }}/analyze.log
        if-no-files-found: error
        retention-days: 14

  build:
    timeout-minutes: 10  # it reads three job results and prints them
    name: build
    needs: [build_arch, build_universal, analyze]
    runs-on: ubuntu-latest
    if: always()

    steps:
    - name: Verify required build jobs
      run: |
        echo "build_arch result: ${{ needs.build_arch.result }}"
        echo "build_universal result: ${{ needs.build_universal.result }}"
        echo "analyze result: ${{ needs.analyze.result }}"

        if [ "${{ needs.build_arch.result }}" != "success" ]; then
          echo "build_arch did not succeed"
          exit 1
        fi

        if [ "${{ needs.build_universal.result }}" != "success" ]; then
          echo "build_universal did not succeed"
          exit 1
        fi

        if [ "${{ needs.analyze.result }}" != "success" ]; then
          echo "the static analyzer job did not succeed"
          exit 1
        fi

        echo "All required build jobs passed."

  verify_images:
    timeout-minutes: 15  # three disk images downloaded and hashed, no toolchain
    name: Verify the published images
    needs: [build_arch, build_universal, build]
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Download the DMG artifacts
      uses: actions/download-artifact@v8
      with:
        pattern: Moonlight-macOS-dmg-*
        path: dist
        merge-multiple: true

    - name: Download the DMG checksum artifacts
      uses: actions/download-artifact@v8
      with:
        pattern: Moonlight-macOS-checksum-*
        path: checksums
        merge-multiple: true

    - name: Verify the images against the checksums taken when they were built
      # This is the release job's check, run on every push, on the artifacts the
      # release job would publish. It is the only way the release path gets exercised
      # before a tag exists: the download pattern, the checksum glob, and the audit's
      # refusal of a missing image all fail here rather than on release day.
      run: ./scripts/verify-release-images.sh checksums dist

  release:
    timeout-minutes: 30  # tag, notes, and a 10 MB asset upload
    needs: [build_arch, build_universal, build, verify_images]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Download x86_64 DMG artifact
      uses: actions/download-artifact@v8
      with:
        name: Moonlight-macOS-dmg-x86_64
        path: dist

    - name: Download arm64 DMG artifact
      uses: actions/download-artifact@v8
      with:
        name: Moonlight-macOS-dmg-arm64
        path: dist

    - name: Download universal DMG artifact
      uses: actions/download-artifact@v8
      with:
        name: Moonlight-macOS-dmg-universal
        path: dist

    - name: Download the DMG checksum artifacts
      uses: actions/download-artifact@v8
      with:
        pattern: Moonlight-macOS-checksum-*
        path: checksums
        merge-multiple: true

    - name: Verify the bytes being released are the bytes that were built
      # The same line the rehearsal job runs on every push. A release job only runs on
      # a tag, so a check written only here would be exercised for the first time while
      # it was publishing something people install.
      run: ./scripts/verify-release-images.sh checksums dist

    - name: Gate the release tag
      # The version in the release title has to be the version inside the DMGs.
      # A tag that disagrees with MARKETING_VERSION, with the build number this
      # commit generates, with the changelog, or with an earlier release would
      # publish an installable package whose identity is wrong, and the only fix
      # afterwards is to withdraw a release people have already installed.
      env:
        TAG: ${{ github.ref_name }}
      run: |
        git fetch --force --tags --quiet
        python3 scripts/release-gate.py \
          --tag "$TAG" \
          --existing-tags "$(git tag --list 'v*' | paste -sd, -)"

    - name: Get Version
      id: version
      run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

    - name: Build Release Body
      env:
        VERSION: ${{ steps.version.outputs.VERSION }}
        GITHUB_REPOSITORY: ${{ github.repository }}
      run: |
        python3 .github/scripts/build_release_body.py

    - name: Create Release
      # The one step holding contents: write, so the one step pinned to an immutable
      # commit instead of a tag its maintainer can repoint.
      # efb3536 == v3
      uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
      with:
        name: ${{ steps.version.outputs.VERSION }}
        draft: false
        prerelease: ${{ contains(github.ref, 'beta') || contains(github.ref, 'alpha') }}
        files: |
          dist/Moonlight-macOS-Enhanced-x86_64.dmg
          dist/Moonlight-macOS-Enhanced-arm64.dmg
          dist/Moonlight-macOS-Enhanced-universal.dmg
          dist/Moonlight-macOS-Enhanced-x86_64.dmg.sha256
          dist/Moonlight-macOS-Enhanced-arm64.dmg.sha256
          dist/Moonlight-macOS-Enhanced-universal.dmg.sha256
        body_path: release_body.md
