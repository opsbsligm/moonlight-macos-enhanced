# GitLab CI/CD pipeline for Moonlight macOS
# Requires a macOS runner with Xcode and shell executor.
#
# Pipeline stages:
#   lint     — Python repository audits and toolchain availability
#   deps     — download binary frameworks
#   build    — compile the app
#   test     — integration smoke test (bundle, signature, launch)
#   package  — produce a DMG (tag / main only)
#   verify   — assertion battery (tag / main only), once the whole build,
#              test and packaging path is off the runner, so the long mutation
#              sweep can never starve the gates it protects
#   mirror   — serialized GitHub mirror after all applicable gates
#
# The Docker-based GitLab security templates are not enabled on shell runners.
# Signing/notarization needs Developer ID credentials and remains a separate gate.

# GRP_CI_JOB_TOKEN is an env_var. Limit its HTTP header to the private
# submodule URL and the lifetime of the recursive Git processes.
.fetch_submodules: &fetch_submodules
  - bash scripts/ci/fetch-submodules.sh


stages:
  - lint
  - deps
  - build
  - test
  - package
  - verify
  - mirror

variables:
  LANG: en_US.UTF-8
  LC_ALL: en_US.UTF-8
  # moonlight-common-c is a submodule that carries submodules of its own
  # (enet, nanors). GitLab does not initialize any of them by default, and
  # the build then fails on the first enet include. Verified locally by
  # building with an uninitialized tree: Limelight-internal.h cannot find
  # ../enet/include/enet/enet.h.
  GIT_SUBMODULE_STRATEGY: none
  # Full clone: build-number.sh needs the real rev-list count; a shallow
  # clone under-reports commits and leaves BUILD_NUMBER empty.
  GIT_DEPTH: "0"
  DERIVED_DATA_PATH: "build/xcode/derivedData"
  XCODE_PROJECT: "Moonlight.xcodeproj"
  XCODE_SCHEME: "Moonlight for macOS"
  CONFIGURATION: "Release"
  # Pinned by download-frameworks.sh; bump here to bust cache.
  DEPS_VERSION: "3.6.0001"

workflow:
  rules: &pipeline_rules
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "web"'

# --- Lint --------------------------------------------------------------------
# The macOS runners carry SwiftLint and clang-format. Fail loudly if they are
# missing instead of reporting a green "skip"; this repository has no committed
# style baseline yet, so a full-tree strict sweep is deliberately not a gate.
lint:toolchain:
  stage: lint
  tags: [macos]
  cache: {}
  timeout: 5 minutes
  rules: *pipeline_rules
  script:
    - |
      set -euo pipefail
      swiftlint --version
      clang-format --version

# Selected repository audits. The full GitHub aggregate and mutation battery
# are not claimed as GitLab coverage.
audit:python:
  stage: lint
  tags: [macos]
  cache: {}
  # Measured ~140s alone; pipeline 647 recorded 1803s (killed at the old
  # 30m ceiling) while the mutation battery and security jobs shared the
  # 8-core runner. The battery now runs after the mirror, but keep headroom
  # for the remaining cross-pipeline overlap on concurrent=2.
  timeout: 60 minutes
  before_script:
    - *fetch_submodules
  dependencies: []
  rules: *pipeline_rules
  script:
    - |
      set -euo pipefail
      venv_dir="$(mktemp -d /tmp/moonlight-gitlab-gates.XXXXXX)"
      trap 'rm -rf "$venv_dir"' EXIT
      python3 -m venv "$venv_dir"
      . "$venv_dir/bin/activate"
      python -m pip install --quiet --disable-pip-version-check pyyaml==6.0.2
      python scripts/ci/test_pipeline.py
      bash scripts/local-gates.sh --self-test
      python scripts/project_identity.py --self-test
      python scripts/credential-scan-audit.py --self-test
      python scripts/credential-scan-audit.py
      python scripts/l10n-audit.py
      python scripts/source-membership-audit.py
      python scripts/constraints-audit.py --no-battery --history
      python scripts/liquid-glass-audit.py --self-test
      python scripts/liquid-glass-audit.py
      python scripts/leak-audit.py --self-test
      python scripts/leak-audit.py --log scripts/leak-sample.txt --red-team
      python scripts/ownership-audit.py --self-test
      python scripts/ownership-audit.py --red-team
      python scripts/workflow-audit.py --self-test
      python scripts/workflow-audit.py
      for script in scripts/*.sh scripts/ci/*.sh; do bash -n "$script"; done

# --- Dependencies ------------------------------------------------------------
# Cache binary frameworks between pipelines. Keyed on DEPS_VERSION so a bump
# automatically invalidates stale caches.

download-deps:
  before_script:
    - *fetch_submodules

  stage: deps
  tags: [macos]
  timeout: 15 minutes
  dependencies: []
  cache:
    key:
      files:
        - scripts/download-frameworks.sh
      prefix: "frameworks-${DEPS_VERSION}"
    paths:
      - xcframeworks/
      - Packages/OpenSSL.xcframework/
    policy: pull-push
  script:
    - zsh scripts/download-frameworks.sh
  artifacts:
    paths:
      - xcframeworks/
      - Packages/OpenSSL.xcframework/
    expire_in: 1 day
  rules: *pipeline_rules

# --- Build -------------------------------------------------------------------
build-app:
  before_script:
    - *fetch_submodules

  stage: build
  tags: [macos]
  timeout: 30 minutes
  dependencies:
    - download-deps
  script:
    # Resolve BUILD_NUMBER from git history. xcodebuild ignores scheme PreActions
    # and the #include? in Version.xcconfig cannot resolve $(DERIVED_FILE_DIR) at
    # parse time, so the value must reach xcodebuild as a command-line setting -
    # those outrank every xcconfig. This job used to write the generated file into
    # the derivedData root, where nothing read it, so CI silently fell back to the
    # checked-in baseline and artifact versions drifted from the git count.
    - set -euo pipefail
    - BUILD_NUMBER_RESOLVED="$(sh Limelight/build-number.sh --print)"
    - export BUILD_NUMBER_RESOLVED
    - echo "resolved BUILD_NUMBER=$BUILD_NUMBER_RESOLVED"
    - xcodebuild
        -project "$XCODE_PROJECT"
        -scheme "$XCODE_SCHEME"
        -configuration "$CONFIGURATION"
        -destination 'platform=macOS'
        -derivedDataPath "$DERIVED_DATA_PATH"
        CODE_SIGN_IDENTITY="-"
        CODE_SIGNING_REQUIRED=NO
        BUILD_NUMBER="$BUILD_NUMBER_RESOLVED"
        clean build 2>&1 | tee build.log | xcpretty --report junit
  artifacts:
    when: always
    paths:
      - $DERIVED_DATA_PATH/Build/Products/$CONFIGURATION/MoonlightEnhanced.app
      - build.log
      - build/reports/
    expire_in: 1 week
  rules: *pipeline_rules

# --- Test --------------------------------------------------------------------
test-app:
  before_script:
    - *fetch_submodules

  stage: test
  tags: [macos]
  timeout: 10 minutes
  dependencies:
    - build-app
  script:
    - set -euo pipefail
    - bash scripts/integration-test.sh
        "$DERIVED_DATA_PATH/Build/Products/$CONFIGURATION/MoonlightEnhanced.app"
        2>&1 | tee test-integration.log
  artifacts:
    when: always
    paths:
      - test-integration.log
    expire_in: 1 week
  rules: *pipeline_rules

# Build-log and binary-level coverage, wired to the exact files that gave the
# project its first "green pipeline with a source nobody compiled" failure.
audit:sources:
  # Six of the gates below compile a probe against a moonlight-common-c header,
  # so a checkout without the submodule dies on FileNotFoundError before any
  # assertion runs. Pipeline 699 job 3729 showed it: the runner took a fresh
  # second build slot (concurrent=2) instead of reusing a warm directory that
  # still held an old submodule, and the job failed on Limelight/.../Limelight.h.
  # That is a reproducible missing input, not a flake, so the input is fetched.
  before_script:
    - *fetch_submodules
  stage: test
  tags: [macos]
  cache: {}
  timeout: 10 minutes
  dependencies:
    - build-app
  script:
    - set -euo pipefail
    - app="$DERIVED_DATA_PATH/Build/Products/$CONFIGURATION/MoonlightEnhanced.app"
    - test -d "$app"
    - python3 scripts/build-warning-audit.py --self-test
    - python3 scripts/build-warning-audit.py --log build.log
    - python3 scripts/source-membership-audit.py --build-log build.log
    - arch="$(uname -m)"
    - python3 scripts/compiled-source-audit.py "$app/Contents/MacOS/MoonlightEnhanced" --arch "$arch" --self-test
    - python3 scripts/compiled-source-audit.py "$app/Contents/MacOS/MoonlightEnhanced" --arch "$arch"
    - python3 scripts/diagnostics-report-tests.py
    - python3 scripts/controller-event-baseline.py
    - python3 scripts/controller-wire-baseline.py
    - python3 scripts/controller-device-table-tests.py
    - python3 scripts/controller-arrival-tests.py
    - python3 scripts/controller-mouse-routing-tests.py
    - python3 scripts/relative-mouse-as-absolute-tests.py
    - python3 scripts/mute-on-focus-loss-tests.py
    - python3 scripts/background-gamepad-tests.py
    - python3 scripts/reconnect-backoff-tests.py
    - python3 scripts/controller-rumble-routing-tests.py
    - python3 scripts/controller-led-routing-tests.py
    - python3 scripts/controller-trigger-rumble-routing-tests.py
    - python3 scripts/controller-motion-event-tests.py
    - python3 scripts/controller-battery-event-tests.py
    - python3 scripts/controller-touch-event-tests.py
    - python3 scripts/controller-event-baseline.py --self-test
    - python3 scripts/controller-wire-baseline.py --self-test
    - python3 scripts/controller-motion-event-tests.py --self-test
    - python3 scripts/controller-battery-event-tests.py --self-test
    - python3 scripts/controller-touch-event-tests.py --self-test
    - python3 scripts/relative-mouse-as-absolute-tests.py --self-test
    - python3 scripts/mute-on-focus-loss-tests.py --self-test
    - python3 scripts/background-gamepad-tests.py --self-test
    - python3 scripts/reconnect-backoff-tests.py --self-test
    - python3 scripts/keyboard-unicode-routing-tests.py
    - python3 scripts/keyboard-ime-routing-tests.py
    - python3 scripts/sas-preset-tests.py
    - python3 scripts/edge-sensor-e1-clamp-tests.py --self-test
  rules: *pipeline_rules

# The full assertion battery: every guard we rely on is broken on purpose and
# shown to be caught. Measured at 71 minutes (146 cases) on a clean local tree,
# so it stays out of the fast path and runs on release branches only. It does
# not need build artifacts: it mutates the checked-out source and asks each
# gate about it.
# It runs in its own verify stage, after package, with no needs: so the stage
# barrier holds it until the build, both test jobs, both audits and the DMG are
# done and off the runner. That is deliberate: it used to start immediately
# beside the release path, and pipeline 647 watched it starve audit:python into
# a timeout (trace gaps of 608s and 779s while load sat at 20-33 on eight
# cores), skipping every downstream gate and leaving main with no DMG. A battery
# that cannot run without damaging the gates it protects is not a gate.
# The mirror still sits after it, so a failed battery keeps blocking the
# GitHub release on a tag exactly as before; only the DMG artifact arrives early.
mutation-battery:
  before_script:
    - *fetch_submodules
  stage: verify
  tags: [macos]
  cache: {}
  # Pipeline 647 watched this job take 9302s (155 minutes) while it fought the
  # release path for CPU, past the old 150-minute ceiling. Standalone it is a
  # measured 71 minutes, so the extra headroom only covers cross-pipeline
  # overlap on the shared runner; the resource_group below keeps two batteries
  # from overlapping each other.
  timeout: 180 minutes
  resource_group: macos-battery
  dependencies: []
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - |
      set -euo pipefail
      venv_dir="$(mktemp -d /tmp/moonlight-battery-venv.XXXXXX)"
      trap 'rm -rf "$venv_dir"' EXIT
      python3 -m venv "$venv_dir"
      . "$venv_dir/bin/activate"
      python -m pip install --quiet --disable-pip-version-check pyyaml==6.0.2
      # The battery refuses a dirty checkout on its own, and the CI working
      # directory is a fresh clone, so no --allow-dirty is needed. Each gate it
      # invokes carries its own recursion flag internally.
      python3 scripts/assertion-battery.py

# --- Package -----------------------------------------------------------------
# Produce a DMG only for tags (releases) and main branch pushes (nightly smoke).
package-dmg:
  before_script:
    - *fetch_submodules

  stage: package
  tags: [macos]
  timeout: 15 minutes
  dependencies:
    - build-app
  # Name the real gates directly instead of relying on the stage barrier: the
  # DMG is ready once build plus both test jobs and the Python audits pass.
  # The ~71-minute battery sits in the verify stage after this pipeline has
  # shipped, so it can neither delay the DMG nor compete with it for the
  # runner's cores.
  needs:
    - build-app
    - test-app
    - audit:sources
    - audit:python
  script:
    # package-dmg.sh reads CFBundleShortVersionString + CFBundleVersion from
    # Info.plist and names the DMG "Moonlight-<ver>-build<num>.dmg" — this
    # guarantees DMG name == app version, regardless of CI context.
    - zsh scripts/package-dmg.sh
        "$DERIVED_DATA_PATH/Build/Products/$CONFIGURATION/MoonlightEnhanced.app"
  artifacts:
    paths:
      - build/*.dmg
    expire_in: 30 days
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

# --- GitHub mirror sync (GitLab is the source of truth) ---------------------
# A fixed service holds the GitHub key and verifies this job and all gates.
publish-github:
  stage: mirror
  tags: [gitlab-mirror]
  resource_group: github-mirror
  timeout: 10 minutes
  interruptible: false
  cache: {}
  dependencies: []
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
  script:
    - MIRROR_DRY_RUN=1 python3 scripts/ci/publish-github.py
    - python3 scripts/ci/publish-github.py

