# GitLab CI/CD pipeline for Moonlight macOS
# Requires a macOS runner with Xcode and shell executor.
#
# Pipeline stages:
#   lint     — code quality gates (SwiftLint, clang-format dry-run)
#   deps     — download binary frameworks
#   build    — compile the app
#   test     — integration smoke test (bundle, signature, launch)
#   package  — produce a DMG (tag / main only)
#
# Security scanning (SAST / Secret Detection / Dependency Scanning) is included
# via GitLab Auto-DevOps templates. Sign/notarize stages are intentionally
# omitted here (no Developer ID configured yet); add a `notarize` stage once
# signing credentials are available as CI/CD Variables.

# Dual-hosting: CI/CD job token (scoped) cannot cross projects for submodule
# fetches, so rewrite the RESOLVED submodule URL to an authenticated one
# using the group-scoped project token (GRP_CI_JOB_TOKEN, file variable). Note:
# insteadOf must match the resolved absolute URL, not the relative .gitmodules path.
# GIT_SUBMODULE_STRATEGY=none: the runner must not touch submodules at clone
# time (no auth configured yet); macos jobs pull them via fetch_submodules.
.fetch_submodules: &fetch_submodules
  - |
    git config --global url."http://oauth2:${GRP_CI_JOB_TOKEN}@172.16.130.6/moonlight/moonlight-common-c.git".insteadOf "http://172.16.130.6/moonlight/moonlight-common-c.git"
    git submodule sync --recursive
    git submodule update --init --recursive


concurrency:
  group: $CI_PROJECT_PATH
  cancel-in-progress: true

stages:
  - lint
  - deps
  - build
  - test
  - package

variables:
  LANG: en_US.UTF-8
  LC_ALL: en_US.UTF-8
  # moonlight-common-c is a submodule that carries submodules of its own
  # (enet, nanors). GitLab does not initialize any of them by default, and
  # the build then fails on the first enet include. Verified locally by
  # building with an uninitialized tree: Limelight-internal.h cannot find
  # ../enet/include/enet/enet.h.
  GIT_SUBMODULE_STRATEGY: none
  # Full clone: build-number.sh needs the real rev-list count; a shallow
  # clone under-reports commits and leaves BUILD_NUMBER empty.
  GIT_DEPTH: "0"
  DERIVED_DATA_PATH: "build/xcode/derivedData"
  XCODE_PROJECT: "Moonlight.xcodeproj"
  XCODE_SCHEME: "Moonlight for macOS"
  CONFIGURATION: "Release"
  # Pinned by download-frameworks.sh; bump here to bust cache.
  DEPS_VERSION: "3.6.0001"

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_COMMIT_TAG'

# --- Security scanning (Auto-DevOps templates) -------------------------------
include:
  # Security scanning templates need a Docker image with /analyzer; the
  # shell-executor runners (Linux VM + macOS) cannot run them. Re-enable
  # with docker executor, or run Semgrep/TruffleHog locally in pre-push.
  # - template: Security/SAST.gitlab-ci.yml
  # - template: Security/Secret-Detection.gitlab-ci.yml
  # - template: Security/Dependency-Scanning.gitlab-ci.yml

# --- Lint --------------------------------------------------------------------
lint:swiftlint:
  stage: lint
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  script:
    - |
      if ! command -v swiftlint >/dev/null 2>&1; then
        echo "SwiftLint not installed — skipping (install via brew install swiftlint)"
        exit 0
      fi
      swiftlint lint --strict Limelight 2>&1 | tee lint-swift.txt
  artifacts:
    when: always
    paths:
      - lint-swift.txt
    expire_in: 1 week

lint:clang-format:
  stage: lint
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  script:
    - |
      if ! command -v clang-format >/dev/null 2>&1; then
        echo "clang-format not installed — skipping"
        exit 0
      fi
      # Dry-run: exit non-zero if any file would be reformatted.
      find Limelight -name '*.m' -o -name '*.h' | \
        xargs clang-format --dry-run -Werror 2>&1 | tee lint-clang.txt
  artifacts:
    when: always
    paths:
      - lint-clang.txt
    expire_in: 1 week

# --- Dependencies ------------------------------------------------------------
# Cache binary frameworks between pipelines. Keyed on DEPS_VERSION so a bump
# automatically invalidates stale caches.
cache:
  key:
    files:
      - scripts/download-frameworks.sh
    prefix: "frameworks-${DEPS_VERSION}"
  paths:
    - xcframeworks/
    - Packages/OpenSSL.xcframework/
  policy: pull-push

download-deps:
  before_script:
    - *fetch_submodules

  stage: deps
  tags: [macos]
  script:
    - zsh scripts/download-frameworks.sh
  artifacts:
    paths:
      - xcframeworks/
      - Packages/OpenSSL.xcframework/
    expire_in: 1 day
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

# --- Build -------------------------------------------------------------------
build-app:
  before_script:
    - *fetch_submodules

  stage: build
  tags: [macos]
  dependencies:
    - download-deps
  script:
    # Resolve BUILD_NUMBER from git history. xcodebuild ignores scheme PreActions
    # and the #include? in Version.xcconfig cannot resolve $(DERIVED_FILE_DIR) at
    # parse time, so the value must reach xcodebuild as a command-line setting -
    # those outrank every xcconfig. This job used to write the generated file into
    # the derivedData root, where nothing read it, so CI silently fell back to the
    # checked-in baseline and artifact versions drifted from the git count.
    - export BUILD_NUMBER_RESOLVED="$(sh Limelight/build-number.sh --print)"
    - echo "resolved BUILD_NUMBER=$BUILD_NUMBER_RESOLVED"
    - xcodebuild
        -project "$XCODE_PROJECT"
        -scheme "$XCODE_SCHEME"
        -configuration "$CONFIGURATION"
        -destination 'platform=macOS'
        -derivedDataPath "$DERIVED_DATA_PATH"
        CODE_SIGN_IDENTITY="-"
        CODE_SIGNING_REQUIRED=NO
        BUILD_NUMBER="$BUILD_NUMBER_RESOLVED"
        build 2>&1 | tee build.log | xcpretty --report junit
  artifacts:
    when: always
    paths:
      - $DERIVED_DATA_PATH/Build/Products/$CONFIGURATION/MoonlightEnhanced.app
      - build.log
      - build/reports/
    expire_in: 1 week
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

# --- Test --------------------------------------------------------------------
test-app:
  before_script:
    - *fetch_submodules

  stage: test
  tags: [macos]
  dependencies:
    - build-app
  script:
    - zsh scripts/integration-test.sh
        "$DERIVED_DATA_PATH/Build/Products/$CONFIGURATION/MoonlightEnhanced.app"
        2>&1 | tee test-integration.log
  artifacts:
    when: always
    paths:
      - test-integration.log
    expire_in: 1 week
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

# --- Package -----------------------------------------------------------------
# Produce a DMG only for tags (releases) and main branch pushes (nightly smoke).
package-dmg:
  before_script:
    - *fetch_submodules

  stage: package
  tags: [macos]
  dependencies:
    - build-app
  script:
    # package-dmg.sh reads CFBundleShortVersionString + CFBundleVersion from
    # Info.plist and names the DMG "Moonlight-<ver>-build<num>.dmg" — this
    # guarantees DMG name == app version, regardless of CI context.
    - zsh scripts/package-dmg.sh
        "$DERIVED_DATA_PATH/Build/Products/$CONFIGURATION/MoonlightEnhanced.app"
  artifacts:
    paths:
      - build/*.dmg
    expire_in: 30 days
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH == "main"'

# --- GitHub mirror sync (best practice: GitLab = source of truth) ------------
# Runs on the untagged VM runner (linux has git + ssh, and the VM can reach
# github.com). Pushes the full mirror via the repo deploy key (GH_DEPLOY_KEY,
# file variable, write-enabled). Runs after the gates in earlier stages.
publish-github:
  stage: package
  dependencies: []
  script:
    - umask 077
    - mkdir -p ~/.ssh && cat "$GH_DEPLOY_KEY" > ~/.ssh/gh_deploy
    - chmod 600 ~/.ssh/gh_deploy
    - |
      cat > ~/.ssh/config <<EOF
      Host github.com
        HostName github.com
        IdentityFile ~/.ssh/gh_deploy
        StrictHostKeyChecking accept-new
      EOF
    - git remote add github git@github.com:opsbsligm/moonlight-macos-enhanced.git 2>/dev/null || git remote set-url github git@github.com:opsbsligm/moonlight-macos-enhanced.git
    # One-way mirror (GitLab = source of truth). Fetch every GitLab head/tag into a
    # dedicated namespace, then force-push + prune to GitHub. Explicit refspecs avoid
    # both the refs/remotes/origin/* push and the branch-deletion of a plain --mirror,
    # and work even when the CI clone is single-branch/shallow.
    - git fetch --prune origin "+refs/heads/*:refs/gh-mirror/*" "+refs/tags/*:refs/tags/*"
    - git push github --force --prune "refs/gh-mirror/*:refs/heads/*"
    - git push github --force "refs/tags/*:refs/tags/*"

