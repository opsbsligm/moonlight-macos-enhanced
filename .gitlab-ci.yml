# GitLab CI/CD pipeline for Moonlight macOS
# Requires a macOS runner with Xcode and shell executor.
#
# Pipeline stages:
#   lint     — Python repository audits and toolchain availability
#   deps     — download binary frameworks
#   build    — compile the app
#   test     — integration smoke test (bundle, signature, launch)
#   package  — produce a DMG (tag / main only)
#   verify   — assertion battery (tag / main only), once the whole build,
#              test and packaging path is off the runner, so the long mutation
#              sweep can never starve the gates it protects
#   mirror   — serialized GitHub mirror after all applicable gates
#
# The Docker-based GitLab security templates are not enabled on shell runners.
# Signing/notarization needs Developer ID credentials and remains a separate gate.

# Fetch the two pinned public dependencies of the integrated protocol library.
.fetch_submodules: &fetch_submodules
  - bash scripts/ci/fetch-submodules.sh


stages:
  - lint
  - deps
  - build
  - test
  - package
  - verify
  - mirror

variables:
  LANG: en_US.UTF-8
  LC_ALL: en_US.UTF-8
  # The protocol sources are tracked here; ENet and SIMDe remain submodules.
  # GitLab does not initialize them by default, and
  # the build then fails on the first enet include. Verified locally by
  # building with an uninitialized tree: Limelight-internal.h cannot find
  # ../enet/include/enet/enet.h.
  GIT_SUBMODULE_STRATEGY: none
  # Full clone: build-number.sh needs the real rev-list count; a shallow
  # clone under-reports commits and leaves BUILD_NUMBER empty.
  GIT_DEPTH: "0"
  DERIVED_DATA_PATH: "build/xcode/derivedData"
  XCODE_PROJECT: "Moonlight.xcodeproj"
  XCODE_SCHEME: "Moonlight for macOS"
  CONFIGURATION: "Release"
  # Pinned by download-frameworks.sh; bump here to bust cache.
  DEPS_VERSION: "3.6.0001"

workflow:
  rules: &pipeline_rules
    # A branch with an open merge request is judged by that merge request, not by
    # its own push pipeline. Pipeline 791 and 792 are the evidence: one push made
    # both, each carrying the five instance security jobs on the single-concurrency
    # 安全扫描 runner plus the full Mac gate set, so fifteen security jobs queued
    # for one verdict and every Mac job behind them waited idle. The merge-request
    # pipeline is the one that decides the merge, so it is the one kept.
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "web"'

# --- Lint --------------------------------------------------------------------
# The macOS runners carry SwiftLint and clang-format. Fail loudly if they are
# missing instead of reporting a green "skip"; this repository has no committed
# style baseline yet, so a full-tree strict sweep is deliberately not a gate.
lint:toolchain:
  stage: lint
  tags: [macos]
  cache: {}
  timeout: 5 minutes
  rules: *pipeline_rules
  script:
    - |
      set -euo pipefail
      swiftlint --version
      clang-format --version

# Selected repository audits. The full GitHub aggregate and mutation battery
# are not claimed as GitLab coverage.
audit:python:
  stage: lint
  tags: [macos]
  cache: {}
  # Measured ~140s alone; pipeline 647 recorded 1803s (killed at the old
  # 30m ceiling) while the mutation battery and security jobs shared the
  # 8-core runner. The battery now runs after the mirror, but keep headroom
  # for the remaining cross-pipeline overlap on concurrent=2.
  timeout: 60 minutes
  before_script:
    - *fetch_submodules
  dependencies: []
  rules: *pipeline_rules
  script:
    - |
      set -euo pipefail
      venv_dir="$(mktemp -d /tmp/moonlight-gitlab-gates.XXXXXX)"
      trap 'rm -rf "$venv_dir"' EXIT
      # The parser bootstrap lives in a script so both jobs that need it fail the
      # same loud way: pipelines 1017 and 1020 both died on a pip TLS failure against
      # a pypi.org that was unreachable from this network, and the job said only
      # "exit status 1". Sourced, not run: pipeline 1025 called this with `bash`,
      # the activation died in the child, and the next line could not find `python`.
      # See scripts/ci/bootstrap-python.sh and the WF026 rule in workflow-audit.py.
      . scripts/ci/bootstrap-python.sh "$venv_dir"
      python scripts/ci/test_pipeline.py
      bash scripts/local-gates.sh --self-test
      python scripts/project_identity.py --self-test
      python scripts/credential-scan-audit.py --self-test
      python scripts/credential-scan-audit.py
      python scripts/l10n-audit.py
      python scripts/source-membership-audit.py
      python scripts/constraints-audit.py --no-battery --history
      # The battery excuses a self-proof gate's red proof when the mutated file is in
      # none of that gate's read surfaces, and those surfaces are the committed snapshot
      # scripts/battery-self-proof-scope.json. A snapshot narrower than the truth
      # silences a proof on exactly the mutation it exists to catch, and the run stays
      # green. This re-measures each gate with an audit hook on `open` and refuses any
      # read the snapshot does not declare. It runs here, on the Mac, because the
      # compile-harness gates shrink their read surface to nothing without an Apple
      # toolchain, and a measurement taken where the harnesses cannot build would be
      # the narrow kind. Verification only; `--write` is a developer action.
      python scripts/battery-scope-probe.py
      python scripts/liquid-glass-audit.py --self-test
      python scripts/liquid-glass-audit.py
      python scripts/leak-audit.py --self-test
      python scripts/leak-audit.py --log scripts/leak-sample.txt --red-team
      python scripts/ownership-audit.py --self-test
      python scripts/ownership-audit.py --red-team
      python scripts/defaults-consistency.py --self-test
      python scripts/defaults-consistency.py
      python scripts/settings-usage-audit.py --self-test
      python scripts/settings-usage-audit.py
      # One stage later than the audit above: a persisted key can have an export row, an
      # accessor, and a consumer, and still do nothing, because the hop from the settings
      # dictionary into `StreamConfiguration` was never written. `shortQueueOnDoubledCadence`
      # shipped that way. This asks, per declared field of the object the stream reads,
      # whether anything assigns it, and only credits a receiver the tree declares as
      # `StreamConfiguration *` -- Connection.m's `_streamConfig` C struct collides on
      # spelling and must not excuse an unwritten property.
      python scripts/stream-config-assembly-audit.py --self-test
      python scripts/stream-config-assembly-audit.py
      # The host's own half of the acceptance pairing. `--expect` states the reviewed verdicts
      # of the real host (LAN address in AGENTS.md, captured 2026-11-02) so the judgement runs on a
      # committed snapshot instead of a live machine: a BLOCKED row here is a fact about that
      # host, not a failure, and what would be a failure is the audit no longer reaching it.
      # One line per command: inside a `|` block a bare continuation line is its own shell
      # word, so the audit would run with no --snapshot and report "nothing to judge".
      python scripts/host-side-evidence-audit.py --self-test
      python scripts/host-side-evidence-audit.py --snapshot scripts/fixtures/home-pc-host-snapshot.json --report scripts/fixtures/home-pc-claim-report.txt --expect host-identity=OK,xbox-360-emulation=OK,ds5-emulation=BLOCKED,switch-emulation=BLOCKED,advertised-versus-host=BLOCKED
      # The public mirror copies whole refs, so a private-network address in a
      # comment or fixture ships to the web. One allowlisted file (AGENTS.md)
      # carries the real values; anything else is refused.
      python scripts/infra-leak-audit.py --self-test
      python scripts/infra-leak-audit.py
      python scripts/workflow-audit.py --self-test
      python scripts/workflow-audit.py
      for script in scripts/*.sh scripts/ci/*.sh; do bash -n "$script"; done

# --- Dependencies ------------------------------------------------------------
# Cache binary frameworks between pipelines. Keyed on DEPS_VERSION so a bump
# automatically invalidates stale caches.

download-deps:
  before_script:
    - *fetch_submodules

  stage: deps
  tags: [macos]
  timeout: 15 minutes
  dependencies: []
  cache:
    key:
      files:
        - scripts/download-frameworks.sh
      prefix: "frameworks-${DEPS_VERSION}"
    paths:
      - xcframeworks/
      - Packages/OpenSSL.xcframework/
    policy: pull-push
  script:
    - zsh scripts/download-frameworks.sh
  artifacts:
    paths:
      - xcframeworks/
      - Packages/OpenSSL.xcframework/
    expire_in: 1 day
  rules: *pipeline_rules

# --- Build -------------------------------------------------------------------
build-app:
  before_script:
    - *fetch_submodules

  stage: build
  tags: [macos]
  timeout: 30 minutes
  dependencies:
    - download-deps
  script:
    # Resolve BUILD_NUMBER from git history. xcodebuild ignores scheme PreActions
    # and the #include? in Version.xcconfig cannot resolve $(DERIVED_FILE_DIR) at
    # parse time, so the value must reach xcodebuild as a command-line setting -
    # those outrank every xcconfig. This job used to write the generated file into
    # the derivedData root, where nothing read it, so CI silently fell back to the
    # checked-in baseline and artifact versions drifted from the git count.
    - set -euo pipefail
    - BUILD_NUMBER_RESOLVED="$(sh Limelight/build-number.sh --print)"
    - export BUILD_NUMBER_RESOLVED
    - echo "resolved BUILD_NUMBER=$BUILD_NUMBER_RESOLVED"
    # The commit identity rides the same channel as the number, for the same reason:
    # a build that announces "build 2050" cannot say which source produced it, so an
    # acceptance claim could not be pinned to a binary. --print-sha prints nothing when
    # HEAD is unreadable, and the plist baseline is then the word `unknown`.
    - GIT_SHA_RESOLVED="$(sh Limelight/build-number.sh --print-sha)"
    - export GIT_SHA_RESOLVED
    - echo "resolved ML_GIT_SHA=${GIT_SHA_RESOLVED:-unknown}"
    # libs/ is gitignored and is not an artifact of download-deps: a build in a
    # fresh slot would otherwise compile moonlight-common with no openssl header
    # path at all (job 10544, pipeline 1449, died on <openssl/evp.h>). The shared
    # script is the single preparation entry point -- every bundle already exists
    # from the artifacts, so this run only rebuilds the two header symlinks and
    # verifies evp.h opens through both spellings.
    - zsh scripts/download-frameworks.sh
    - xcodebuild
        -project "$XCODE_PROJECT"
        -scheme "$XCODE_SCHEME"
        -configuration "$CONFIGURATION"
        -destination 'platform=macOS'
        -derivedDataPath "$DERIVED_DATA_PATH"
        CODE_SIGN_IDENTITY="-"
        CODE_SIGNING_REQUIRED=NO
        BUILD_NUMBER="$BUILD_NUMBER_RESOLVED"
        ML_GIT_SHA="${GIT_SHA_RESOLVED:-unknown}"
        clean build 2>&1 | tee build.log | xcpretty --report junit
  artifacts:
    when: always
    paths:
      - $DERIVED_DATA_PATH/Build/Products/$CONFIGURATION/MoonlightEnhanced.app
      - build.log
      - build/reports/
    expire_in: 1 week
  rules: *pipeline_rules

# --- Test --------------------------------------------------------------------
test-app:
  before_script:
    - *fetch_submodules

  stage: test
  tags: [macos]
  timeout: 10 minutes
  dependencies:
    - build-app
  script:
    - set -euo pipefail
    - bash scripts/integration-test.sh
        "$DERIVED_DATA_PATH/Build/Products/$CONFIGURATION/MoonlightEnhanced.app"
        2>&1 | tee test-integration.log
  artifacts:
    when: always
    paths:
      - test-integration.log
    expire_in: 1 week
  rules: *pipeline_rules

# Build-log and binary-level coverage, wired to the exact files that gave the
# project its first "green pipeline with a source nobody compiled" failure.
audit:sources:
  # Six of the gates below compile a probe against a moonlight-common-c header,
  # so a checkout without the submodule dies on FileNotFoundError before any
  # assertion runs. Pipeline 699 job 3729 showed it: the runner took a fresh
  # second build slot (concurrent=2) instead of reusing a warm directory that
  # still held an old submodule, and the job failed on Limelight/.../Limelight.h.
  # That is a reproducible missing input, not a flake, so the input is fetched.
  before_script:
    - *fetch_submodules
  stage: test
  tags: [macos]
  cache: {}
  timeout: 10 minutes
  dependencies:
    - build-app
  script:
    - set -euo pipefail
    - app="$DERIVED_DATA_PATH/Build/Products/$CONFIGURATION/MoonlightEnhanced.app"
    - test -d "$app"
    - python3 scripts/build-warning-audit.py --self-test
    - python3 scripts/build-warning-audit.py --log build.log
    - python3 scripts/source-membership-audit.py --build-log build.log
    - arch="$(uname -m)"
    - python3 scripts/compiled-source-audit.py "$app/Contents/MacOS/MoonlightEnhanced" --arch "$arch" --self-test
    - python3 scripts/compiled-source-audit.py "$app/Contents/MacOS/MoonlightEnhanced" --arch "$arch"
    - python3 scripts/diagnostics-report-tests.py
    - python3 scripts/hardware-acceptance-check.py --self-test
    - python3 scripts/controller-event-baseline.py
    - python3 scripts/controller-wire-baseline.py
    - python3 scripts/controller-device-table-tests.py
    - python3 scripts/controller-arrival-tests.py
    - python3 scripts/controller-mouse-routing-tests.py
    - python3 scripts/relative-mouse-as-absolute-tests.py
    - python3 scripts/mute-on-focus-loss-tests.py
    - python3 scripts/audio-no-traffic-hint-tests.py
    - python3 scripts/background-gamepad-tests.py
    - python3 scripts/reconnect-backoff-tests.py
    - python3 scripts/controller-rumble-routing-tests.py
    - python3 scripts/controller-led-routing-tests.py
    - python3 scripts/controller-trigger-rumble-routing-tests.py
    - python3 scripts/controller-motion-event-tests.py
    - python3 scripts/controller-battery-event-tests.py
    - python3 scripts/controller-touch-event-tests.py
    - python3 scripts/controller-event-baseline.py --self-test
    - python3 scripts/controller-wire-baseline.py --self-test
    - python3 scripts/controller-motion-event-tests.py --self-test
    - python3 scripts/controller-battery-event-tests.py --self-test
    - python3 scripts/controller-touch-event-tests.py --self-test
    - python3 scripts/relative-mouse-as-absolute-tests.py --self-test
    - python3 scripts/mute-on-focus-loss-tests.py --self-test
    - python3 scripts/audio-no-traffic-hint-tests.py --self-test
    - python3 scripts/background-gamepad-tests.py --self-test
    - python3 scripts/reconnect-backoff-tests.py --self-test
    # Wave Z-2: the battery writes the shipped source, so an interrupt that restores the
    # tree and then fails to die leaves a run that said goodbye and kept going -- a Ctrl+C
    # that reads as ignored, and a cancel that only lands on SIGKILL. The unblock that
    # fixes it is run in a child and timed, not grepped; delete it and the harness reports
    # a child still alive 15s after its own signal.
    - python3 scripts/battery-interrupt-tests.py
    - python3 scripts/battery-interrupt-tests.py --self-test
    - python3 scripts/keyboard-unicode-routing-tests.py
    - python3 scripts/keyboard-ime-routing-tests.py
    - python3 scripts/sas-preset-tests.py
    # Wave G-1: UTF-8 text has to pack densely on Sunshine and stay one code
    # point per packet on GFE, and this is the only gate that can tell those two
    # send paths apart on the wire rather than in the text of the source.
    - python3 scripts/unicode-dense-packing-tests.py
    - python3 scripts/edge-sensor-e1-clamp-tests.py --self-test
  rules: *pipeline_rules

# Gate parity between the two pipeline definitions.
#
# The repository carries two definitions and gates have historically landed on the
# mirror first, so the source of truth reached 33 of the 87 gates the image called while
# `local-gates.sh` reported a green local sweep over all of them. This job is the
# authority catching up: it asserts the reconciliation holds, then runs every gate
# that the audit classifies as fast, plus the self-test form of the artefact-shaped
# ones. The commands come from the audit at run time, so a gate added to either file
# reaches here without a second edit -- and the audit refuses a gate that reaches
# neither.
#
# `--class=fast` is spelled out three times on purpose. The audit decides coverage by
# looking for a literal `--class=<name>` on a line that also names an interpreter, so
# a loop variable here would make every class look unclaimed and the job that closes
# the gap would itself be the gap.
#
# It takes no build artefacts (`dependencies: []`) because every fast gate was
# measured runnable on a bare checkout: `compile-audit.py` type-checks 87 of 87
# sources with no flags, and the four that read a moonlight-common-c header are
# covered by the submodule fetch.
audit:gates:
  before_script:
    - *fetch_submodules
  stage: test
  tags: [macos]
  cache: {}
  # Measured 80s for all 47 on an M2 laptop. The headroom is for two pipelines
  # sharing one eight-core runner, which is the known condition here.
  timeout: 25 minutes
  dependencies: []
  rules: *pipeline_rules
  script:
    - set -euo pipefail
    - python3 scripts/gate-coverage-audit.py --self-test
    - python3 scripts/gate-coverage-audit.py
    # The battery's own cost report is a gate, not a log line to eyeball: the ceiling
    # for the 240-minute job is about to be set from that number, and a total which only
    # survives an orderly finish cannot be trusted by the run that needs it most. This
    # runs the shipped restore path in a child, signals it, and requires the total to
    # reach stdout before the child dies. Sub-second, so it belongs with the fast set.
    - python3 scripts/battery-cost-report-tests.py
    # The list goes through a file rather than a command substitution. `local-gates.sh`
    # reads this definition too, and its discovery pattern cuts from the interpreter to
    # the end of the line, so `list="$(python3 ... --class=fast)"` would hand it a gate
    # command ending in `)"` -- the sweep would then fail in bash's voice instead of a
    # gate's. Written this way the line it finds is the emission it should expand.
    #
    # `--class=fast` stays literal beside the interpreter for the same reason one layer
    # down: the audit decides a class is claimed by finding that spelling on a line that
    # also names python3, so a loop variable would make every class look unclaimed to the
    # very job that claims it.
    - python3 scripts/gate-coverage-audit.py --emit-commands --class=fast > gates-fast.txt
    - python3 scripts/gate-coverage-audit.py --emit-commands --class=selftest > gates-selftest.txt
    # bash reading empty stdin exits 0. An empty emission would therefore report a green
    # sweep over zero gates, which is the silence every rule in this file exists to end,
    # so the lists are required to be non-empty and their sizes are printed.
    - test -s gates-fast.txt
    - test -s gates-selftest.txt
    # The line is single-quoted because a plain YAML scalar may not hold `: `, and
    # this one says "fast gates:" twice. An unquoted version parses as a mapping and
    # the whole definition stops loading -- scripts/ci/test_pipeline.py loads it with
    # the same parser GitLab does, so the local sweep says so before a runner does.
    - 'echo "fast gates: $(wc -l < gates-fast.txt), self-test gates: $(wc -l < gates-selftest.txt)"'
    # `-x` puts each gate in the log as it runs, so the log says which gates ran.
    - bash -eo pipefail -x < gates-fast.txt
    - bash -eo pipefail -x < gates-selftest.txt

# The deep pass: the two gates that compile something before they can judge anything.
#
# `render-probe.py` builds a whole Debug configuration of the app into its own
# derivedData directory (measured ~20 minutes cold, ~67s warm), and
# `scaling-output-evidence-tests.py` compiles a renderer harness. Neither belongs in
# front of every merge request: a gate that costs a developer a build gets switched
# off, and a gate that is switched off is not a gate. They run where the mutation
# battery already runs -- releases and main -- so every change still meets them before
# it reaches a tag.
#
# Two things here are deliberate and are the reason this job is not folded into the
# battery. `needs:` is absent, so the stage barrier holds it until the release path is
# off the runner; giving it `needs: []` would start a second 20-minute xcodebuild
# beside the build that produces the DMG, which is the pipeline-647 failure again. The
# `resource_group` is the battery's, so a battery and a deep pass never share the one
# eight-core Mac either.
audit:deep:
  before_script:
    - *fetch_submodules
  stage: verify
  tags: [macos]
  cache: {}
  # 20 minutes for the cold Debug build, plus the harness compiles, plus headroom for
  # cross-pipeline overlap on the shared runner.
  timeout: 60 minutes
  resource_group: macos-battery
  # The frameworks the Debug build links against; not the Release .app, which tells
  # this job nothing.
  dependencies: [download-deps]
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - set -euo pipefail
    # Literal class, file rather than substitution, non-empty list: same three reasons as
    # audit:gates above.
    - python3 scripts/gate-coverage-audit.py --emit-commands --class=deep > gates-deep.txt
    - test -s gates-deep.txt
    # Single-quoted for the same reason audit:gates is: a plain scalar holding `: ` reads
    # as a mapping, and the step arrives at the runner as a hash instead of a command.
    - 'echo "deep gates: $(wc -l < gates-deep.txt)"'
    - bash -eo pipefail -x < gates-deep.txt

# The full assertion battery: every guard we rely on is broken on purpose and
# shown to be caught. Measured at 71 minutes (146 cases) on a clean local tree,
# so it stays out of the fast path and runs on release branches only. It does
# not need build artifacts: it mutates the checked-out source and asks each
# gate about it.
# It runs in its own verify stage, after package, with no needs: so the stage
# barrier holds it until the build, both test jobs, both audits and the DMG are
# done and off the runner. That is deliberate: it used to start immediately
# beside the release path, and pipeline 647 watched it starve audit:python into
# a timeout (trace gaps of 608s and 779s while load sat at 20-33 on eight
# cores), skipping every downstream gate and leaving main with no DMG. A battery
# that cannot run without damaging the gates it protects is not a gate.
# The mirror still sits after it, so a failed battery keeps blocking the
# GitHub release on a tag exactly as before; only the DMG artifact arrives early.
mutation-battery:
  before_script:
    - *fetch_submodules
  stage: verify
  tags: [macos]
  cache: {}
  # Pipeline 647 watched this job take 9302s (155 minutes) while it fought the
  # release path for CPU, past the old 150-minute ceiling. Standalone it is a
  # measured 71 minutes, so the extra headroom only covers cross-pipeline
  # overlap on the shared runner; the resource_group below keeps two batteries
  # from overlapping each other.
  # 200, from the first measured post-trim main run rather than a projection:
  # pipeline 1090 job 7281 (SHA c0b74bc2) finished 153/153 cases in 8893s
  # (148.2 minutes) on the shared two-slot runner while the release path was
  # already built in the same pipeline, so the number includes the contention
  # the old ceiling was bought against. The job's own COST line is now the
  # source: if a future run prints a mean that projects past 160 minutes, the
  # ceiling and this comment change together. The pre-trim numbers stay on
  # record in the commit history of this file.
  timeout: 200 minutes
  resource_group: macos-battery
  dependencies: []
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - |
      set -euo pipefail
      venv_dir="$(mktemp -d /tmp/moonlight-battery-venv.XXXXXX)"
      trap 'rm -rf "$venv_dir"' EXIT
      # Same bootstrap as `audit:python`: the battery's judge imports the parser
      # through `constraints-audit.py`, so a parser that did not install would send
      # every mutation down a path that cannot judge it.
      . scripts/ci/bootstrap-python.sh "$venv_dir"
      # The battery refuses a dirty checkout on its own, and the CI working
      # directory is a fresh clone, so no --allow-dirty is needed. Each gate it
      # invokes carries its own recursion flag internally.
      python3 scripts/assertion-battery.py

# --- Package -----------------------------------------------------------------
# Produce a DMG only for tags (releases) and main branch pushes (nightly smoke).
package-dmg:
  before_script:
    - *fetch_submodules

  stage: package
  tags: [macos]
  timeout: 15 minutes
  dependencies:
    - build-app
  # Name the real gates directly instead of relying on the stage barrier: the
  # DMG is ready once build plus both test jobs and the Python audits pass.
  # The ~71-minute battery sits in the verify stage after this pipeline has
  # shipped, so it can neither delay the DMG nor compete with it for the
  # runner's cores.
  needs:
    - build-app
    - test-app
    - audit:sources
    - audit:python
  script:
    - set -euo pipefail
    # `build/` is git-ignored and the runner keeps it between jobs, so an image from an
    # earlier run is still sitting there when packaging starts. Left alone it is audited
    # and uploaded as though this job made it, and the first image graded against a
    # source-read build number would be last night's. Clearing happens before packaging
    # for that reason: after packaging would delete the image this job is about to audit.
    - rm -f build/*.dmg build/*.dmg.sha256
    # package-dmg.sh reads CFBundleShortVersionString + CFBundleVersion from
    # Info.plist and names the DMG "Moonlight-<ver>-build<num>.dmg" — this
    # guarantees DMG name == app version, regardless of CI context.
    - zsh scripts/package-dmg.sh
        "$DERIVED_DATA_PATH/Build/Products/$CONFIGURATION/MoonlightEnhanced.app"
    # Audit the image this job just made, in the job that made it. The image is what a
    # user downloads, and until now nothing on the source of truth ever opened one:
    # `dmg-audit.py` ran only `--self-test-checksums` here, so a nightly that shipped
    # without the Info.plist language tables -- every permission prompt in one language
    # -- went out with every job green. The expected version is read from the source, not
    # from the bundle: the same build carried `CFBundleVersion` 1720 while its own commit
    # counted 2054, so a bundle asked to certify itself passes by definition.
    - expected_version="$(python3 scripts/project_identity.py --print-version)"
    - expected_build="$(sh Limelight/build-number.sh --print)"
    - echo "expecting version $expected_version build $expected_build"
    - |
      for image in build/*.dmg; do
        python3 scripts/dmg-audit.py "$image" \
          --version "$expected_version" --build "$expected_build"
      done
  artifacts:
    paths:
      - build/*.dmg
    expire_in: 30 days
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

# --- GitHub mirror sync (GitLab is the source of truth) ---------------------
# A fixed service holds the GitHub key and verifies this job and all gates.
publish-github:
  stage: mirror
  tags: [gitlab-mirror]
  resource_group: github-mirror
  timeout: 10 minutes
  interruptible: false
  cache: {}
  dependencies: []
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
  script:
    - MIRROR_DRY_RUN=1 python3 scripts/ci/publish-github.py
    - python3 scripts/ci/publish-github.py

